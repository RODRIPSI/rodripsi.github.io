<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ECEEEA;--surface:#FFFFFF;--ink:#1D2330;--muted:#5C636E;--rule:#D3D7D0;--soft:#E2E6DF;--focus:#2F6FC0;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181E;--surface:#1F232B;--ink:#E6E8EB;--muted:#9BA2AC;--rule:#343A45;--soft:#2A2F38;--focus:#76A8EA}}
:root[data-theme="dark"]{--bg:#15181E;--surface:#1F232B;--ink:#E6E8EB;--muted:#9BA2AC;--rule:#343A45;--soft:#2A2F38;--focus:#76A8EA}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{min-height:100%}
.side{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.brand{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.01em}
.mark{width:30px;height:30px;flex:none;display:inline-block}.mark svg{width:100%;height:100%;display:block}.topbar{--kbg:var(--bg)}.side{--kbg:var(--surface)}
main{max-width:720px;margin:0 auto;padding:12px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 14px;font-size:13px;color:var(--muted);position:relative}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--ink)}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:11px;line-height:18px;font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:8px 0 18px}
.label{display:block;font-size:14px;font-weight:500;color:var(--muted);margin:22px 0 8px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
textarea{font-family:var(--serif);font-size:18px;line-height:1.6;resize:vertical;min-height:150px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip.sug{border-style:dashed;border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{flex:1}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:10px;background:var(--ink);color:var(--surface);padding:14px;font-weight:600;font-size:16px}
.secondary{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.err{font-size:14px;color:#B3261E;margin:8px 0 0}
.clist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.clist button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:16px 4px}
.cbar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.cname{font-family:var(--serif);font-size:20px;display:block}
.cmeta{font-size:14px;color:var(--muted)}
.idea{position:relative;background:var(--surface);border-radius:10px;padding:14px 16px 14px 22px;margin:0 0 12px;overflow:hidden}
.stripe{position:absolute;left:0;top:0;bottom:0;width:6px;display:flex;flex-direction:column}
.stripe span{flex:1}
.idea .when{font-size:13px;color:var(--muted);margin:0 0 6px}
.idea .txt{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0}
.idea .moment{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin:8px 0 0}
.idea .ref{font-size:13px;color:var(--muted);margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags i{width:7px;height:7px;border-radius:50%;display:inline-block}
.back{border:0;background:none;color:var(--muted);padding:6px 0;font-size:15px}
.chead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-left:6px solid;padding-left:14px;margin:10px 0 22px}
.chead h1{margin:0}
details.block{margin:0 0 18px}
details.block>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);margin-bottom:12px;font-weight:600}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;align-self:center;margin-right:4px}
details.block[open]>summary::before{transform:rotate(45deg)}
.count{font-weight:400;color:var(--muted)}
.doc{background:var(--surface);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.doc .fname{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.state{display:inline-block;font-size:13px;border:1px solid var(--rule);border-radius:6px;padding:2px 8px}
.doc dl{margin:10px 0 0;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.doc dt{color:var(--muted)}
.doc dd{margin:0}
.doc .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.day{font-size:14px;font-weight:600;color:var(--muted);margin:22px 0 10px;text-transform:none}
.day:first-of-type{margin-top:0}
.empty{background:var(--surface);border-radius:10px;padding:22px;color:var(--muted);text-align:center}
.foot{margin-top:28px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:8px 10px;margin-top:22px}
@media (min-width:768px){
 .app{display:grid;grid-template-columns:260px 1fr}
 .topbar,.tabs{display:none}
 .side{display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100%;overflow-y:auto;border-right:1px solid var(--rule);padding:24px 18px;background:var(--surface)}
 .side .topb{display:flex;align-items:center;gap:10px;margin-bottom:26px}
 .side nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:15px}
 .side nav button[aria-current="true"]{background:var(--soft);font-weight:600}
 .side .sub{font-size:13px;font-weight:500;color:var(--muted);margin:22px 10px 6px}
 .side .cl button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:15px}
 .side .cl button[aria-current="true"]{background:var(--soft)}
 main{padding:36px 44px 48px;max-width:760px;margin:0}
 .toast{bottom:28px}
}
.excerpt{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--muted);margin:0}
.rename{background:var(--surface);border-radius:10px;padding:12px 16px;margin-top:22px}
.rename .old{margin:0;font-size:14px;color:var(--muted);text-decoration:line-through}
.rename .new{margin:4px 0 0;font-family:var(--serif);font-size:17px}
.progress{height:4px;background:var(--rule);border-radius:2px;margin:0 0 18px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink)}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.res{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:10px}
.res .fname{font-size:16px;margin:0 0 4px}
.res .excerpt{font-size:14px}
mark{background:#F2D98A;color:#1D2330;border-radius:3px;padding:0 2px}
.panel{background:var(--surface);border-radius:10px;padding:16px;margin:0 0 12px;border:1px solid var(--rule)}
.panel .rename{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.syncbtn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);margin-left:auto;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .syncbtn{margin:0 0 18px;max-width:100%;text-align:left}
.warn{background:#FBE9E7;color:#8A1F17;border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A2220;color:#F2B8B0}}
:root[data-theme="dark"] .warn{background:#3A2220;color:#F2B8B0}
.idea .acts{margin-top:8px}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.incrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
input.cites{width:90px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
textarea.small{min-height:110px;font-size:16px}
.primary[disabled]{opacity:.6}
a{color:inherit}
/* visual do protótipo, para o app inteiro */
:root{--bg:#EEF0F4;--surface:#FFFFFF;--ink:#1C2330;--muted:#5E6675;--rule:#D7DBE3;--soft:#E4E7EE;--focus:#2B4C9B;--accent:#2B4C9B;--c-q:#C26A17;--c-d:#2E7D5B;--c-c:#6A4C93;--c-x:#C0392B;
--sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Source Serif 4",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141821;--surface:#1D2330;--ink:#E7EAF0;--muted:#9AA3B2;--rule:#2E3646;--soft:#2C3342;--focus:#7F9FE6;--accent:#7F9FE6;--c-q:#E79A4E;--c-d:#5DBB8E;--c-c:#B39AD9;--c-x:#F06B5B}}
:root[data-theme="dark"]{--bg:#141821;--surface:#1D2330;--ink:#E7EAF0;--muted:#9AA3B2;--rule:#2E3646;--soft:#2C3342;--focus:#7F9FE6;--accent:#7F9FE6;--c-q:#E79A4E;--c-d:#5DBB8E;--c-c:#B39AD9;--c-x:#F06B5B}
h1{font-weight:600;color:var(--accent)}
.brand{font-weight:600}
.tabs button[aria-current="true"]{color:var(--accent)}
.tabs button[aria-current="true"]::before{background:var(--accent);height:3px}
.side button[aria-current="true"]{color:var(--accent)}
.primary{background:var(--accent);color:#fff;border-radius:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
.badge-n{background:var(--accent);color:#fff}
.idea,.doc,.panel{border:1px solid var(--rule);border-radius:14px}
.cname{font-weight:600}
.pl-sec{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:16px;margin-bottom:14px}
.pl-sec h3{margin:0 0 6px;font-family:var(--serif);font-size:19px;font-weight:600;color:var(--accent);display:flex;align-items:baseline;gap:8px}
.pl-sec h3 small{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--muted)}
.pl-sec h4{margin:18px 0 8px;font-size:14px;font-weight:600}
.pl-rot{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.pl-rot.q{color:var(--c-q)}.pl-rot.d{color:var(--c-d)}.pl-rot.c{color:var(--c-c)}.pl-rot.x{color:var(--c-x)}
textarea.pl-t{width:100%;min-height:42px;font-family:var(--sans);font-size:15px;line-height:1.5;padding:8px 10px;border-radius:9px;background:var(--bg);resize:none;overflow:hidden}
.pl-t.q{border-left:3px solid var(--c-q)}.pl-t.d{border-left:3px solid var(--c-d)}.pl-t.c{border-left:3px solid var(--c-c)}.pl-t.x{border-left:3px solid var(--c-x)}
.pl-add{font-size:14px;font-weight:500;margin-top:10px;padding:8px 13px;border-radius:9px;border:1px dashed var(--accent);background:none;color:var(--accent)}
.pl-demo{border:1px solid var(--rule);border-radius:12px;margin-top:8px}
.pl-demo-cab{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:left}
.pl-dn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.pl-dt b{display:block;font-size:15px}.pl-dt small{font-size:12.5px;color:var(--muted)}
.pl-demo-corpo{border-top:1px solid var(--rule);padding:4px 14px 14px}
.pl-pas{border:1px solid var(--rule);border-left:3px solid var(--c-q);border-radius:10px;padding:4px 12px 10px;margin-bottom:8px}.pl-pas.ok{border-left-color:var(--c-d)}
.pl-conf{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-top:8px;border:0;background:none;padding:4px 0}
.pl-cb{width:20px;height:20px;flex:none;border-radius:5px;border:2px solid var(--rule);display:inline-grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface)}
[aria-pressed="true"]>.pl-cb,.pl-cb[aria-pressed="true"]{background:var(--c-d);border-color:var(--c-d);color:#fff}
.pl-pars{margin-top:14px;border-top:1px solid var(--rule);padding-top:10px}
.pl-sum{cursor:pointer;font-weight:600;font-size:15px;padding:4px 0}
.pl-par{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-top:8px}
.pl-par-cab{display:flex;align-items:center;gap:10px}.pl-pn{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--c-c);min-width:20px}
.pl-ets{display:flex;flex-wrap:wrap;gap:4px}.pl-ets button{font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:6px;border:1px solid var(--rule);background:var(--bg);color:var(--muted)}
.pl-ets button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pl-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}@media (max-width:520px){.pl-2{grid-template-columns:1fr;gap:0}}
.pl-elo{border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:10px}.pl-elo.ok{border-color:var(--c-d)}
.pl-elo small{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.pl-elo-a{font-size:14.5px;border-left:3px solid var(--c-x);padding-left:10px}.pl-elo-a small{color:var(--c-x)}
.pl-elo-b{font-size:14.5px;border-left:3px solid var(--c-q);padding-left:10px}.pl-elo-b small{color:var(--c-q)}
.pl-seta{padding:2px 0 2px 6px;color:var(--muted)}
.pl-eb[aria-pressed="true"]{background:var(--c-d);border-color:var(--c-d);color:#fff}
.pl-seq{border-left:3px solid var(--rule);padding-left:12px}.pl-seq p{margin:0 0 6px;font-family:var(--serif);font-size:15.5px;line-height:1.5}
.pl-q{color:var(--c-q)}.pl-d{color:var(--c-d)}.pl-x{color:var(--c-x);margin-top:8px!important}
.pl-seq-d{display:flex;gap:10px;margin:10px 0}.pl-seq-d .pl-dn{width:22px;height:22px;font-size:12px}
.pl-chk{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:14.5px}.pl-chk span{flex:1}
.pl-chk .pl-cb{cursor:pointer}
.pl-x{font-size:18px;border:0;background:none;color:var(--muted);padding:0 4px}
.pl-modl{font-size:14.5px;padding:7px 0;border-bottom:1px dashed var(--rule)}.pl-modl .et{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--ink);color:var(--surface);margin-right:8px}
.pl-imp ul{margin:0 0 10px;padding-left:18px;font-size:14.5px}
.d-perg{margin:10px 0 4px;padding:10px 12px;border-left:3px solid var(--c-q);background:color-mix(in srgb,var(--c-q) 8%,transparent);border-radius:0 8px 8px 0;font-family:var(--serif);font-size:15.5px;line-height:1.45}
.d-perg small{display:block;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--c-q);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.d-acc{background:var(--accent);border-color:var(--accent);color:#fff}
.d-wa{border-color:#1f8f4e;color:#1f8f4e}
.ws{margin:10px 0;padding:12px 14px;border:1px solid #1f8f4e;border-radius:12px;background:var(--bg)}
.ws-doc{display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px dashed var(--rule);background:none;padding:9px 0;text-align:left;font-size:15px}
.ws-doc small{margin-left:auto;color:var(--muted);font-size:12.5px}
.ws-go{display:block;text-align:center;text-decoration:none;background:#1f8f4e!important;margin-top:8px}.ws-go.off{opacity:.45}
.cand{border-left:3px solid var(--c-c);padding:6px 0 6px 11px;margin-bottom:10px}.cand.usada{border-left-color:var(--c-d);opacity:.8}
.cand p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.5}
.rit-svg{display:block;width:100%;min-width:320px;height:auto}

.rit-d{aspect-ratio:1;border-radius:3px}.rit-lab{font-size:11px;color:var(--muted);padding-right:6px}

/* dissertação */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-ok:#5DBB8E;--t-folga:#5DBB8E;--t-sem2:#E3C04A;--t-sem1:#EE9447;--t-red:#F06B5B}}
:root[data-theme="dark"]{--t-ok:#5DBB8E;--t-folga:#5DBB8E;--t-sem2:#E3C04A;--t-sem1:#EE9447;--t-red:#F06B5B}
.tabs.cinco button{font-size:12px;padding-left:2px;padding-right:2px}
.d-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.d-bar span{display:block;height:100%}.d-bar-ok{background:var(--t-ok)}.d-bar-and{background:var(--t-sem1)}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.d-stats div{border-top:1px solid var(--rule);padding-top:8px}

<script>
const KNOT='<svg viewBox="140 36 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="190" cy="70" r="26" fill="none" stroke="#C8372D" stroke-width="7"/><circle cx="174" cy="98" r="26" fill="none" stroke="#2F6FC0" stroke-width="7"/><circle cx="206" cy="98" r="26" fill="none" stroke="#2E9A57" stroke-width="7"/>'+
[["M206.3 90.2 A26 26 0 0 1 192.2 95.9","#C8372D"],["M166.6 81.2 A26 26 0 0 1 164.3 66.2","#C8372D"],["M183.3 73.7 A26 26 0 0 1 195.3 83.1","#2F6FC0"],["M195.3 112.9 A26 26 0 0 1 183.3 122.3","#2F6FC0"],["M180.3 101.8 A26 26 0 0 1 182.5 86.8","#2E9A57"],["M208.2 72.1 A26 26 0 0 1 222.3 77.8","#2E9A57"]]
.map(([d,c])=>`<path d="${d}" fill="none" stroke="var(--kbg)" stroke-width="13"/><path d="${d}" fill="none" stroke="${c}" stroke-width="7"/>`).join('')+'</svg>';

const CLIENT_ID="631476153010-sm6d1udia8cn34mn3t7p4gnaaghcr9qh.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive";
const FOLDER_NAME="Bloco Mágico",DATA_NAME="bloco-magico-dados.json",KEY="bloco-magico-v1";
const DOCX="application/vnd.openxmlformats-officedocument.wordprocessingml.document",GDOC="application/vnd.google-apps.document";
const DOCQ=`(mimeType='${DOCX}' or mimeType='application/msword' or mimeType='${GDOC}')`;
const PALETTE=["#2A8C82","#7A4E8C","#4A6FA5","#B8862B","#A4563A","#5E7F3A","#9A4668","#3F7F99","#8C6A3F","#5B5FA8","#A13D3D","#3E8A63"];
const STATES={sem:"Sem fundamentação",parcial:"Parcialmente fundamentado",fund:"Fundamentado",concl:"Concluído"};
const TYPES={prim:"Fontes primárias",com:"Comentadores contemporâneos"};
const SEED=["Sujeito","Outro","Constituição do sujeito","Transferência","Repetição","Sujeito suposto saber","Posição do analista","Desejo do analista","Manejo","Demanda","Desejo","Sugestão","Pulsão","Afeto","Juízo","Disposição","Desamparo","Eu","Id","Supereu","Complexo de Édipo","Aparelho psíquico","Real","Simbólico","Imaginário","Fantasia","Saber","Interpretação","Interpretação da cena","Sintoma","Histeria","Psicose","Ética"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowIso=()=>new Date().toISOString();
const isoDay=t=>t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
const todayIso=()=>isoDay(new Date());
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
const fold=t=>String(t).split("").map(c=>c.normalize("NFD")[0]||"").join("").toLowerCase();
const fmtTime=d=>new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const fmtDay=ts=>cap(new Date(ts).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"}));
const fmtShort=ts=>new Date(ts).toLocaleDateString("pt-BR",{day:"numeric",month:"short"})+", "+fmtTime(ts);
const fmtFull=ts=>new Date(ts).toLocaleDateString("pt-BR",{day:"numeric",month:"long",year:"numeric"})+", "+fmtTime(ts);
const brDate=iso=>iso?iso.slice(0,10).split("-").reverse().join("/"):"";

/* ---------- dados ---------- */
function seed(){return{version:1,concepts:SEED.map((n,i)=>({id:"seed-"+slug(n),name:n,color:PALETTE[i%PALETTE.length],updatedAt:"2026-01-01T00:00:00.000Z"})),refs:[],ideas:[],docs:[],subs:[],chapters:[],symbols:[],plans:[],sends:[],ritmo:[],meta:{}}}
function loadLocal(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);for(const k of["concepts","refs","ideas","docs","subs","chapters","symbols","plans","sends","ritmo"])d[k]=d[k]||[];d.meta=d.meta||{};return d}}catch(e){}return seed()}
let db=loadLocal();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast("Não foi possível salvar no aparelho.")}}
const L=k=>db[k].filter(x=>!x.deleted);
const C=id=>db.concepts.find(c=>c.id===id&&!c.deleted);
const R=id=>db.refs.find(r=>r.id===id&&!r.deleted);
const touch=o=>{o.updatedAt=nowIso();return o};
const usage=id=>L("ideas").filter(i=>i.concepts.includes(id)).length;
const sortedConcepts=()=>L("concepts").sort((a,b)=>usage(b.id)-usage(a.id)||a.name.localeCompare(b.name,"pt"));
const pending=()=>L("ideas").filter(i=>!i.concepts.some(id=>C(id)));
const docsOf=id=>L("docs").filter(d=>d.concepts.includes(id));
function changed(){saveLocal();setDirty(true);scheduleSync()}
function merge(a,b){
 const out={version:1,meta:{...(b.meta||{}),...(a.meta||{})}};
 if(((b.meta||{}).lastBackup||"")>((a.meta||{}).lastBackup||""))out.meta.lastBackup=b.meta.lastBackup;
 for(const k of["concepts","refs","ideas","docs","subs","chapters","symbols","plans","sends","ritmo"]){const m=new Map();for(const x of(b[k]||[]))m.set(x.id,x);
  for(const x of(a[k]||[])){const y=m.get(x.id);if(!y||(x.updatedAt||"")>=(y.updatedAt||""))m.set(x.id,x)}out[k]=[...m.values()]}
 return out}
function makeConcept(name){name=name.trim();if(!name){toast("Digite o nome do conceito.");return null}
 const ex=L("concepts").find(c=>fold(c.name)===fold(name));if(ex){toast("Esse conceito já existe.");return null}
 const c=touch({id:uid("c"),name,color:PALETTE[db.concepts.length%PALETTE.length]});db.concepts.push(c);changed();return c}

/* ---------- Google ---------- */
let token=null,tokenExp=0,tokenClient=null,tokenWait=null;
const hasToken=()=>!!token&&Date.now()<tokenExp-60000;
function gisReady(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();let n=0;const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res()}else if(++n>80){clearInterval(t);rej(new Error("Não foi possível carregar o login do Google."))}},100)})}
async function getToken(interactive){
 if(hasToken())return token;
 if(!interactive)throw new Error("auth");
 await gisReady();
 if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
  callback:r=>{const w=tokenWait;tokenWait=null;if(!w)return;if(r.error)w.rej(new Error("auth"));else{token=r.access_token;tokenExp=Date.now()+(+r.expires_in||3600)*1000;try{localStorage.setItem("bm-connected","1")}catch(e){}w.res(token)}},
  error_callback:e=>{const w=tokenWait;tokenWait=null;if(w)w.rej(new Error("auth"))}});
 let first=true;try{first=!localStorage.getItem("bm-connected")}catch(e){}
 return new Promise((res,rej)=>{tokenWait={res,rej};tokenClient.requestAccessToken({prompt:first?"consent":""})})}
async function api(path,opts={}){
 const t=await getToken(false);
 const r=await fetch("https://www.googleapis.com/"+path,{...opts,headers:{Authorization:"Bearer "+t,...(opts.headers||{})}});
 if(r.status===401){token=null;throw new Error("auth")}
 if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}const er=new Error(m||("Erro "+r.status));er.status=r.status;throw er}
 return r}
const qs=o=>new URLSearchParams(o).toString();
const qesc=s=>s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function listFiles(q,fields="files(id,name,modifiedTime,mimeType,webViewLink,parents)",extra={}){
 let out=[],pt="";do{const r=await(await api("drive/v3/files?"+qs({q,fields:"nextPageToken,"+fields,pageSize:"1000",...extra,...(pt?{pageToken:pt}:{})}))).json();out=out.concat(r.files||[]);pt=r.nextPageToken||""}while(pt&&out.length<5000);return out}
const fids={};
async function ensureFolder(name,parent){const f=await listFiles(`name='${qesc(name)}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`,"files(id)");if(f.length)return f[0].id;
 return(await(await api("drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent]})})).json()).id}
async function appFolder(){if(!fids.app)fids.app=await ensureFolder(FOLDER_NAME,"root");return fids.app}
async function subFolder(n){if(!fids[n])fids[n]=await ensureFolder(n,await appFolder());return fids[n]}
async function upload(meta,blob,id){const b="bm"+Date.now();
 const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${blob.type||"application/octet-stream"}\r\n\r\n`,blob,`\r\n--${b}--`]);
 return(await api("upload/drive/v3/files"+(id?"/"+id:"")+"?uploadType=multipart&fields=id,name,webViewLink",{method:id?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body})).json()}
async function renameFile(id,name){return(await api(`drive/v3/files/${id}?fields=id,name,webViewLink`,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})})).json()}
async function fileText(f){
 if(f.mimeType===GDOC)return(await api(`drive/v3/files/${f.id}/export?mimeType=text/plain`)).text();
 if(f.mimeType===DOCX||/\.docx$/i.test(f.name)){if(!window.mammoth)return "";const ab=await(await api(`drive/v3/files/${f.id}?alt=media`)).arrayBuffer();return(await mammoth.extractRawText({arrayBuffer:ab})).value||""}
 return ""}
const fnames={root:"Meu Drive"};
async function folderNames(files){const ids=[...new Set(files.flatMap(f=>f.parents||[]))].filter(id=>!(id in fnames));
 await Promise.all(ids.map(async id=>{try{fnames[id]=(await(await api(`drive/v3/files/${id}?fields=name`)).json()).name}catch(e){fnames[id]=""}}))}
const extOf=f=>f.mimeType===GDOC?"":((f.name.match(/\.(docx|doc)$/i)||[".docx"])[0].toLowerCase());
const nameFor=(cid,title,date,ext)=>`${C(cid)?C(cid).name:""} — ${title.trim()} — ${date}${ext}`;
const driveLink=d=>d.webViewLink||`https://drive.google.com/file/d/${d.fileId}/view`;

/* ---------- Word ---------- */
const CT=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
const RELS=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
async function buildDocx(paras){
 if(!window.JSZip)throw new Error("Componente de Word ainda carregando. Tente de novo em instantes.");
 const clean=t=>String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
 const P=p=>{const[sz,b,i,before,after]={title:[36,1,0,0,120],h:[28,1,0,360,160],b:[24,1,0,120,40],p:[24,0,0,0,80],meta:[20,0,1,0,60]}[p.s]||[24,0,0,0,80];
  const txt=clean(p.t).split("\n").map(esc).join('</w:t></w:r><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="'+sz+'"/></w:rPr><w:br/><w:t xml:space="preserve">');

let syncing=false,syncErr=false,syncTimer=null,lastSync=null,dirty=false;
try{dirty=localStorage.getItem("bm-dirty")==="1"}catch(e){}
function setDirty(v){dirty=v;try{localStorage.setItem("bm-dirty",v?"1":"0")}catch(e){}setSync()}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),2500)}
function syncText(){
 if(syncing)return "Sincronizando…";
 if(!navigator.onLine)return "Sem internet, salvo no aparelho";
 if(syncErr)return "Falha ao sincronizar. Toque para tentar";
 if(!hasToken())return lastSync?"Toque para sincronizar":"Toque para conectar ao Drive";
 if(dirty)return "Enviando alterações…";
 return lastSync?`Sincronizado às ${fmtTime(lastSync)}`:"Conectado ao Drive"}
function setSync(){document.querySelectorAll(".syncbtn").forEach(b=>b.textContent=syncText())}
async function sync(interactive){
 if(syncing)return;
 if(!navigator.onLine){setSync();if(interactive)toast("Sem internet. Tudo continua salvo no aparelho.");return}
 if(!interactive&&!hasToken()){setSync();return}
 syncing=true;syncErr=false;setSync();
 const before=JSON.stringify(db);
 try{
  await getToken(interactive);
  const folder=await appFolder();
  const found=await listFiles(`name='${DATA_NAME}' and '${folder}' in parents and trashed=false`,"files(id)");
  const fileId=found[0]&&found[0].id;let remote=null;
  if(fileId)remote=await(await api(`drive/v3/files/${fileId}?alt=media`)).json();
  const merged=remote?merge(db,remote):JSON.parse(JSON.stringify(db));
  const today=todayIso();
  if(remote&&(!merged.meta.lastBackup||(new Date(today)-new Date(merged.meta.lastBackup))/864e5>=7)){
   await upload({name:`backup-${today}.json`,parents:[folder]},new Blob([JSON.stringify(remote)],{type:"application/json"}));merged.meta.lastBackup=today}
  const blob=new Blob([JSON.stringify(merged)],{type:"application/json"});
  if(fileId)await upload({},blob,fileId);else await upload({name:DATA_NAME,parents:[folder]},blob);
  const editedMeanwhile=JSON.stringify(db)!==before;
  db=merge(db,merged);saveLocal();lastSync=new Date();
  if(editedMeanwhile){dirty=true;scheduleSync()}else setDirty(false);
  if(JSON.stringify(db)!==before)softRender();
 }catch(e){
  if(e.message!=="auth"){syncErr=true;if(interactive)toast("Não foi possível sincronizar. Tudo continua salvo no aparelho.")}
  else if(interactive)toast("Login não concluído. Toque de novo para conectar.");
 }finally{syncing=false;setSync();if(route.name==="batch"||link)softRender();if(route.name==="diss"&&hasToken()&&db.meta.dissFolder&&!dscan)scanDiss(false)}}

const ETAPAS=["CO","NE","PE","CI","LEI","DES","NOINSU"];

function blocosDocx(xml){
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const doc=new DOMParser().parseFromString(xml,"application/xml"), body=doc.getElementsByTagNameNS(W,"body")[0];
  const txt=el=>{ let t=""; const walk=n=>{ for(const c of n.childNodes){ if(c.namespaceURI!==W) continue;
      if(c.localName==="t") t+=c.textContent; else if(c.localName==="tab") t+=" "; else if(c.localName==="br") t+="\n";
      else if(c.localName==="p"){ if(t&&!t.endsWith("\n")) t+="\n"; walk(c); } else walk(c); } };
    walk(el); return t.split("\n").map(x=>x.replace(/[ \t]+/g," ").trim()).filter(Boolean).join("\n"); };
  const out=[];
  for(const el of body.childNodes){
    if(el.namespaceURI!==W) continue;
    if(el.localName==="p"){ const st=el.getElementsByTagNameNS(W,"pStyle")[0]; const t=txt(el); if(t) out.push({tipo:"p",t,est:st?st.getAttributeNS(W,"val")||st.getAttribute("w:val")||"":""}); }
    if(el.localName==="tbl"){
      const rows=[...el.childNodes].filter(r=>r.localName==="tr").map(r=>[...r.childNodes].filter(c=>c.localName==="tc").map(txt));
      if(rows.length===1&&rows[0].length===1) out.push({tipo:"p",t:rows[0][0],est:"caixa"});
      else if(rows.length&&rows.every(r=>r.length===1)) rows.forEach(r=>r[0]&&out.push({tipo:"p",t:r[0],est:"caixa"}));
      else out.push({tipo:"tab",rows});
    }
  }
  return out;
}
function interpretarEsquema(bl){
  const pl=planoVazio(); pl.checklist=[]; const sobra=[]; let titulo="", numero="";
  const rot=(t,r)=>{ const m=t.match(new RegExp("^"+r+"\\s*:?\\s*","i")); return m?t.slice(m[0].length).trim():null; };
  const eTitulo=b=>b.tipo==="p"&&(/heading|t[íi]tulo/i.test(b.est)||/^\d{1,2}\.\s+\S/.test(b.t))&&b.t.length<140;
  let secao="", demo=null;
  const demoN=k=>{ while(pl.demos.length<k) pl.demos.push({nome:"",insuf:"",pergunta:"",conceitos:"",descoberta:"",naoDemonstra:"",noinsu:"",passagens:[],pars:[]}); return pl.demos[k-1]; };
  for(const b of bl){
    if(b.tipo==="p"){
      const t=b.t, mSub=t.match(/^Subt[íi]tulo\s+(\d+\.\d+)/i); if(mSub&&!numero){ numero=mSub[1]; continue; }
      if(eTitulo(b)){
        const md=t.match(/Demonstra[çc][ãa]o\s+(\d+)\s*[—–-]\s*(.+)$/i);
        if(md){ secao="demo"; demo=demoN(+md[1]); if(!demo.nome) demo.nome=md[2].trim(); continue; }
        if(!(/heading\s*1|t[íi]tulo\s*1/i.test(b.est)||/^\d{1,2}\.\s/.test(t))) continue; // subtítulo interno (ex.: Quadro dos parágrafos)
        demo=null;
        secao=/sequ[êe]ncia cont[íi]nua/i.test(t)?"seq":/regras espec/i.test(t)?"regras":/checklist/i.test(t)?"chk":/modelos/i.test(t)?"modelos":"outro"; continue;
      }
      let v;
      if((v=rot(t,"T[íi]tulo provis[óo]rio"))!==null){ titulo=v.replace(/^\d+\.\d+\s*/,""); const m=v.match(/^(\d+\.\d+)/); if(m&&!numero) numero=m[1]; continue; }
      if(!demo){
        if((v=rot(t,"Pergunta organizadora"))!==null){ pl.ficha.pergunta=v; continue; }
        if((v=rot(t,"Hip[óo]tese do subt[íi]tulo"))!==null){ pl.ficha.hipotese=v; continue; }
        if((v=rot(t,"Fun[çc][ãa]o no cap[íi]tulo[^:]*"))!==null){ pl.ficha.funcao=v; continue; }
        if((v=rot(t,"Conquista final"))!==null){ pl.ficha.conquista=v; continue; }
        if((v=rot(t,"NOINSU final"))!==null){ pl.ficha.noinsu=v; continue; }
      } else {
        if((v=rot(t,"Pergunta"))!==null){ demo.pergunta=v; continue; }
        if((v=rot(t,"Conceitos(\\/opera[çc][õo]es)?"))!==null){ demo.conceitos=v; continue; }
        if((v=rot(t,"O que n[ãa]o demonstra"))!==null){ demo.naoDemonstra=v; continue; }
        if((v=rot(t,"NOINSU"))!==null){ demo.noinsu=v; continue; }
      }
      if(demo&&(v=rot(t,"Resultado necess[áa]rio"))!==null){ demo.resultado=v; continue; }
      if(demo&&(v=rot(t,"L[óo]gica geral"))!==null){ demo.logica=v; continue; }
      if(/^(M[ée]todo aplicado|Resultado necess[áa]rio|L[óo]gica geral|Controle documental|Estado do planejamento|Uso correto)/i.test(t)){ if(secao!=="modelos") sobra.push(t); continue; }
      if(secao==="seq"){ pl.sequencia+=(pl.sequencia?"\n":"")+t; continue; }
      if(secao==="regras"){ pl.regras+=(pl.regras?"\n":"")+t; continue; }
      if(secao==="chk"){ t.split("\n").filter(Boolean).forEach(x=>pl.checklist.push({t:x.trim(),ok:false})); continue; }
      if(secao==="modelos") continue;
      continue;
    }
    // tabelas
    const h=b.rows[0].map(x=>x.toLowerCase()), corpo=b.rows.slice(1);
    const col=nome=>h.findIndex(x=>x.includes(nome));
    if(col("passagem")>=0&&col("uso")>=0){
      corpo.forEach(r=>{ const k=parseInt(r[col("demonstra")>=0?col("demonstra"):0])||1; demoN(k).passagens.push({texto:r[col("texto")]||"",passagem:r[col("passagem")]||"",pagina:r[col("página")>=0?col("página"):col("pagina")]||"",uso:r[col("uso")]||"",conferida:false}); });
    } else if(col("insufici")>=0&&col("descoberta")>=0){
      corpo.forEach(r=>{ const m=(r[0]||"").match(/^(\d+)\s*[—–-]?\s*(.*)$/); if(!m) return; const d=demoN(+m[1]);
        d.nome=d.nome||m[2].trim(); d.insuf=r[col("insufici")]||""; d.pergunta=r[col("pergunta")]||d.pergunta; d.descoberta=r[col("descoberta")]||""; const ni=h.findIndex(x=>x.includes("nova insufici")); if(ni>=0) d.noinsu=r[ni]||d.noinsu; });
    } else if(col("etapa")>=0&&col("fun")>=0&&demo){
      corpo.forEach(r=>{ demo.pars.push({etapas:(r[col("etapa")]||"").toUpperCase().split(/[^A-Z]+/).filter(e=>ETAPAS.includes(e)),funcao:r[col("fun")]||"",recebe:r[col("recebe")]||"",entrega:r[col("entrega")]||"",frase:r[col("frase")>=0?col("frase"):col("estrutura")]||""}); });
    } else if(secao!=="modelos") sobra.push("Tabela não reconhecida: "+b.rows[0].join(" | "));
  }
  if(!pl.checklist.length) pl.checklist=CHECK_PADRAO.map(t=>({t,ok:false}));
  return {pl,sobra,titulo,numero};
}

/* ---------- leitor de citações (do protótipo) ---------- */
const normT=s=>String(s||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
function citacoesDoDocx(bl){
  const cits=[], refs=[]; let ano="", obra="", naRef=false, ult=null;
  const reRef=/\(([A-ZÀ-Ý]{3,}),\s*([^,()]+?),\s*p\.\s*([^)]+)\)\.?\s*$/;
  for(const b of bl){
    if(b.tipo!=="p") continue;
    const t=b.t;
    if(/heading\s*1/i.test(b.est)){ naRef=/^refer[êe]ncias/i.test(t); ano=t; ult=null; continue; }
    if(/heading\s*2/i.test(b.est)){ obra=t; ult=null; continue; }
    if(naRef){ const m=t.match(/^[A-ZÀ-Ý]+,\s*[^.]+\.\s*(.+?)\s*\[/); if(m) refs.push({titulo:m[1],vol:(t.match(/volume\s+(\d+)/i)||[])[1]||"",ref:t}); continue; }
    const m=t.match(reRef);
    if(/^["“]/.test(t)&&m){
      ult={obra, periodo:ano, texto:t.slice(0,m.index).trim().replace(/^["“]|["”]$/g,"").trim(), autor:m[1], ano:m[2].trim(), pag:m[3].trim(), expl:""};
      cits.push(ult); continue;
    }
    if(ult&&!ult.expl&&obra){ ult.expl=t; continue; }
  }
  // volume de cada obra a partir das referências ABNT
  const chaveObra=s=>normT(s.replace(/\([^)]*\)\s*$/,"").replace(/\(.*?\)/g,"")).slice(0,22);
  cits.forEach(c=>{
    const r=refs.find(r=>chaveObra(r.titulo)&&chaveObra(c.obra).startsWith(chaveObra(r.titulo).slice(0,16)))||refs.find(r=>normT(c.obra).includes(normT(r.titulo).slice(0,16)));
    c.vol=r?r.vol:""; c.refABNT=r?r.ref:"";
    c.nota=/n[ãa]o [ée] (uma )?frase d[eo]|n[ãa]o escrita por|nota editorial|nota [^.]{0,30}dos (tradutores|editores)/i.test(c.expl)||/^No original/i.test(c.texto);
    c.semPag=/s\.?\s*p\.?$/i.test(c.pag);
  });
  return cits;
}

async function sincronizarPrazo(s){
 try{
  if(!s.prazo){if(s.calId){try{await cal(`calendars/primary/events/${s.calId}`,{method:"DELETE"})}catch(e){if(e.status!==404)throw e}s.calId="";touch(s);changed()}return "Prazo removido da agenda"}
  let ev=null;if(s.calId){try{ev=await cal(`calendars/primary/events/${s.calId}`,{method:"PATCH",body:JSON.stringify(eventoPrazo(s))})}catch(e){if(e.status!==404)throw e}}
  if(!ev)ev=await cal("calendars/primary/events",{method:"POST",body:JSON.stringify(eventoPrazo(s))});
  s.calId=ev.id;s.calErr="";touch(s);changed();return `Prazo na agenda: ${brDate(s.prazo)}, com lembrete dois dias antes`}
 catch(e){s.calErr=e.message==="calapi"?"api":e.message==="calauth"?"auth":"erro";touch(s);changed();
  if(e.message==="calapi")return "O prazo foi salvo, mas a agenda do Google ainda não está ativada no projeto. Veja as instruções no subtítulo.";
  if(e.message==="calauth")return "O prazo foi salvo, mas a agenda não foi autorizada.";
  return "O prazo foi salvo, mas não consegui falar com a agenda: "+e.message}}
function calAviso(s){if(!s.prazo)return "";if(s.calId&&!s.calErr)return `<p class="hint" style="margin:6px 0 0">Está na sua agenda do Google, com lembrete às 9h, dois dias antes.</p>`;
 if(s.calErr==="api")return `<div class="warn" style="margin-top:8px">A agenda do Google ainda não está ativada no projeto do aplicativo. Para ativar, uma vez só: em console.cloud.google.com, abra o projeto <b>Bloco Magico</b>, vá em <b>APIs e serviços → Biblioteca</b>, procure <b>Google Calendar API</b> e toque em <b>Ativar</b>. Depois toque abaixo.</div><div class="row"><button class="secondary" data-a="dcal" data-id="${s.id}">Colocar na agenda</button></div>`;
 return `<div class="row"><button class="secondary" data-a="dcal" data-id="${s.id}">Colocar na agenda do Google</button></div>`}

/* ---------- minha definição do conceito ---------- */
let defEdit=null;
function defEstado(c){return c.defEstab?"estabilizada":cheio(c.def)?"em elaboração":"sem definição"}
function defBloco(c){const h=c.defHist||[],ed=defEdit===c.id;
 return `<div class="panel def ${c.defEstab?"estab":""}"><div class="def-cab"><p class="def-t">Minha definição</p><span class="def-st ${c.defEstab?"ok":cheio(c.def)?"and":""}">${defEstado(c)}</span></div>
 ${ed?`<textarea id="defta" class="small" placeholder="Como você define ${esc(c.name)} na dissertação">${esc(c.def||"")}</textarea><label class="label" for="defsrc">Apoiada em (autores, obras, páginas)</label><input type="text" id="defsrc" value="${esc(c.defSrc||"")}" placeholder="Ex.: Freud, 1912; Lacan, Seminário 8">
  <div class="row"><button class="secondary d-acc" data-a="defsave" data-id="${c.id}">Salvar</button><button class="link" data-a="defx">Cancelar</button></div><p class="hint">A definição anterior fica guardada no histórico. Se estava estabilizada, volta para “em elaboração”.</p>`
 :cheio(c.def)?`<p class="def-txt">${esc(c.def).replace(/\n/g,"<br>")}</p>${c.defSrc?`<p class="hint" style="margin:6px 0 0">Apoiada em: ${esc(c.defSrc)}</p>`:""}
  <div class="row"><button class="link" data-a="defedit" data-id="${c.id}">Reescrever</button>${c.defEstab?`<button class="link" data-a="defestab" data-id="${c.id}">Reabrir para revisão</button>`:`<button class="secondary d-ok" data-a="defestab" data-id="${c.id}">Marcar como estabilizada</button>`}</div>`
 :`<p class="hint" style="margin:4px 0 0">A definição que você estabilizar para a dissertação, separada das compilações e dos fragmentos.</p><div class="row"><button class="secondary" data-a="defedit" data-id="${c.id}">Escrever a definição</button></div>`}
 ${h.length&&!ed?`<details style="margin-top:10px"><summary class="hint" style="cursor:pointer">Versões anteriores (${h.length})</summary>${h.slice().reverse().map(v=>`<div class="def-v"><b>${esc(brDate(v.dt))}${v.estab?" · estava estabilizada":""}</b>${esc(v.def).replace(/\n/g,"<br>")}</div>`).join("")}</details>`:""}</div>`}
async function actDef(a,el){const d=el?el.dataset:{},c=d.id&&C(d.id);
 switch(a){
 case "defedit":defEdit=d.id;return render();
 case "defx":defEdit=null;return render();
 case "defsave":{const v=($("#defta").value||"").trim(),src=($("#defsrc").value||"").trim();
  if(v===(c.def||"")&&src===(c.defSrc||"")){defEdit=null;return render()}
  if(cheio(c.def))(c.defHist=c.defHist||[]).push({dt:todayIso(),def:c.def,src:c.defSrc||"",estab:!!c.defEstab});
  const era=c.defEstab;c.def=v;c.defSrc=src;c.defEstab=false;touch(c);defEdit=null;changed();render();return toast(era?"Definição salva. Voltou para “em elaboração” porque mudou.":"Definição salva")}
 case "defestab":{c.defEstab=!c.defEstab;touch(c);changed();render();return toast(c.defEstab?"Definição marcada como estabilizada":"Definição reaberta para revisão")}
 }return actWa(a,el)}

/* ---------- desenho geral ---------- */
const NAV=[["capture","Capturar"],["concepts","Conceitos"],["timeline","Linha do tempo","Tempo"],["pending","Pendentes"],["diss","Dissertação"]];
function renderNav(){
 const sub=["concept","batch","bib","auto","acervo","aficha"].includes(route.name),cur=sub?"concepts":["form","plano","ritmo"].includes(route.name)?"diss":route.name,np=pending().length;
 $("#tabs").classList.toggle("cinco",NAV.length>4);$("#tabs").innerHTML=NAV.map(([k,l,s])=>`<button data-a="nav" data-to="${k}" aria-current="${cur===k}">${s||l}${k==="pending"&&np?`<span class="badge-n">${np}</span>`:""}</button>`).join("");
 $("#side").innerHTML=`<div class="topb"><span class="mark">${KNOT}</span><span class="brand">Bloco Mágico</span></div><button class="syncbtn" data-a="sync"></button>
 <nav>${NAV.map(([k,l])=>`<button data-a="nav" data-to="${k}" aria-current="${cur===k&&!sub}">${l}${k==="pending"&&np?`<span class="badge-n">${np}</span>`:""}</button>`).join("")}
 <button data-a="nav" data-to="batch" aria-current="${route.name==="batch"}">Organizar pasta do Drive</button><button data-a="nav" data-to="bib" aria-current="${route.name==="bib"}">Bibliografia</button><button data-a="nav" data-to="acervo" aria-current="${route.name==="acervo"||route.name==="aficha"}">Acervo Freud e Lacan</button><button data-a="nav" data-to="form" aria-current="${route.name==="form"}">Formalização</button></nav>
 <p class="sub">Seus conceitos</p><div class="cl">${sortedConcepts().map(c=>`<button data-a="open" data-id="${c.id}" aria-current="${route.name==="concept"&&route.id===c.id}"><span style="width:9px;height:9px;border-radius:50%;background:${c.color};display:inline-block;flex:none"></span>${esc(c.name)}</button>`).join("")}</div>`;
 setSync()}
function render(){renderNav();$("#main").innerHTML=({capture:vCapture,concepts:vConcepts,concept:vConcept,timeline:vTimeline,pending:vPending,batch:vBatch,bib:vBib,diss:vDiss,auto:vAuto,acervo:vAcervo,aficha:vAficha,form:vForm,plano:vPlano,ritmo:vRitmo}[route.name]||vConcepts)();bind()}
function softRender(){const a=document.activeElement;if(a&&$("#main").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){renderNav()}else render()}
function on(sel,ev,fn){const e=$(sel);if(e)e.addEventListener(ev,fn);return e}
function bind(){
 on("#t","input",e=>{draft.text=e.target.value;if(err){err="";const x=$(".err");if(x)x.remove()}});
 on("#m","input",e=>draft.moment=e.target.value);on("#r","change",e=>draft.refId=e.target.value);
 const nc=on("#nc","keydown",e=>{if(e.key==="Enter")act("mkc")});if(nc&&showNew)nc.focus();
 const nc2=on("#nc2","keydown",e=>{if(e.key==="Enter")act("mkc2")});if(nc2&&showNew2)nc2.focus();
 const lq=on("#lq","input",e=>{link.q=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,500)});
 if(lq&&link&&link.focus){lq.focus();lq.setSelectionRange(lq.value.length,lq.value.length)}
 const lt=on("#lt","input",e=>{link.title=e.target.value;const n=$("#ln");if(n)n.textContent=link.mode==="new"?nameFor(link.cid,link.title||"[título]",todayIso(),".docx"):nameFor(link.cid,link.title||"[título]",link.file.modifiedTime.slice(0,10),extOf(link.file))});
 if(lt&&link&&link.focus&&link.mode==="new")lt.focus();if(link)link.focus=false;
 on("#ls","change",e=>link.state=e.target.value);
 on("#bt","input",e=>{batch.title=e.target.value;const n=$("#nn");if(n)n.textContent=bName()});on("#bs","change",e=>batch.state=e.target.value);
 on("#bfq","input",e=>{batch.filter=e.target.value;$("#bfl").innerHTML=folderList()});
 on("#de-s","change",e=>de.state=e.target.value);
 document.querySelectorAll(".cites").forEach(i=>i.addEventListener("input",e=>de.inc[e.target.dataset.ref]=Math.max(0,parseInt(e.target.value)||0)));
 on("#acvq","input",e=>{acvQ=e.target.value;const pos=e.target.selectionStart;render();const n=$("#acvq");if(n){n.focus();n.setSelectionRange(pos,pos)}});
 bindForm();bindPlano();bindWa();bindCits();bindDiss()}

/* ---------- ações ---------- */
function tog(arr,id){const i=arr.indexOf(id);i>=0?arr.splice(i,1):arr.push(id);return arr.includes(id)}
async function act(a,el){
 const id=el&&el.dataset.id;
 try{switch(a){
 case "nav":if(el.dataset.to==="auto")auto=null;if(el.dataset.to==="batch"&&(!batch||batch.step==="classify"&&batch.idx>=batch.queue.length))batch={step:"folders",folders:null,filter:"",queue:[],idx:0,skipped:[],done:0,sel:[],title:"",state:"sem",text:null};return go({name:el.dataset.to});
 case "open":return go({name:"concept",id});
 case "sync":case "connect":await sync(true);return render();
 case "dtog":draft.concepts.has(id)?draft.concepts.delete(id):draft.concepts.add(id);return el.setAttribute("aria-pressed",draft.concepts.has(id));
 case "showall":showAll=!showAll;return render();
 case "newc":showNew=!showNew;return render();
 case "newc2":showNew2=!showNew2;return render();
 case "mkc":{const c=makeConcept(($("#nc")||{}).value||"");if(c){draft.concepts.add(c.id);showNew=false;render();toast(`Conceito criado: ${c.name}`)}return}
 case "mkc2":{const c=makeConcept(($("#nc2")||{}).value||"");if(c){showNew2=false;render();toast(`Conceito criado: ${c.name}`)}return}
 case "save":{if(!draft.text.trim()){err="Escreva a ideia antes de salvar.";render();$("#t").focus();return}
  db.ideas.push(touch({id:uid("i"),text:draft.text.trim(),moment:draft.moment.trim(),refId:draft.refId,concepts:[...draft.concepts],ts:nowIso()}));
  const pend=!draft.concepts.size;draft={text:"",moment:"",refId:"",concepts:new Set()};changed();render();return toast(pend?"Ideia salva em Pendentes":"Ideia salva")}
 case "ptog":{const s=psel[el.dataset.i];s.has(id)?s.delete(id):s.add(id);return el.setAttribute("aria-pressed",s.has(id))}
 case "classify":{const s=psel[el.dataset.i];if(!s||!s.size)return toast("Marque ao menos um conceito.");const i=db.ideas.find(x=>x.id===el.dataset.i);i.concepts=[...s];touch(i);delete psel[i.id];changed();render();return toast("Ideia classificada")}
 case "iedit":{const i=db.ideas.find(x=>x.id===id);editIdea=id;ieSel=i.concepts.filter(C);return render()}
 case "ietog":return el.setAttribute("aria-pressed",tog(ieSel,id));
 case "iecancel":editIdea=null;return render();
 case "iesave":{const i=db.ideas.find(x=>x.id===id),t=$("#ie-t").value.trim();if(!t)return toast("A ideia não pode ficar vazia.");
  Object.assign(i,{text:t,moment:$("#ie-m").value.trim(),refId:$("#ie-r").value,concepts:[...ieSel]});touch(i);editIdea=null;changed();render();return toast("Ideia atualizada")}
 case "iedel":{if(!confirm("Excluir esta ideia?"))return;const i=db.ideas.find(x=>x.id===id);i.deleted=true;touch(i);editIdea=null;changed();render();return toast("Ideia excluída")}
 case "crename":{const c=C(id),n=prompt("Novo nome do conceito",c.name);if(!n||!n.trim()||n.trim()===c.name)return;
  if(L("concepts").some(x=>x.id!==id&&fold(x.name)===fold(n.trim())))return toast("Já existe um conceito com esse nome.");c.name=n.trim();touch(c);changed();render();return toast("Conceito renomeado. Os arquivos já vinculados mantêm o nome atual.")}
 case "cdel":{const c=C(id);if(!confirm(`Excluir o conceito "${c.name}"? As ideias e os textos continuam, só perdem esta etiqueta.`))return;
  c.deleted=true;touch(c);L("ideas").forEach(i=>{if(i.concepts.includes(id)){i.concepts=i.concepts.filter(x=>x!==id);touch(i)}});
  L("docs").forEach(d=>{if(d.concepts.includes(id)){d.concepts=d.concepts.filter(x=>x!==id);if(d.main===id)d.main=d.concepts[0]||null;touch(d)}});changed();return go({name:"concepts"})}
 case "dopen":{const d=db.docs.find(x=>x.id===id);return window.open(driveLink(d),"_blank","noopener")}
 case "dedit":{const d=db.docs.find(x=>x.id===id);editDoc=id;de={state:d.state,concepts:[...d.concepts],intended:[...d.intended],inc:Object.fromEntries(d.incorporated.map(x=>[x.ref,x.cites]))};return render()}
 case "detog":{const d=db.docs.find(x=>x.id===editDoc);if(id===d.main)return toast("Este é o conceito principal do texto.");return el.setAttribute("aria-pressed",tog(de.concepts,id))}
 case "deint":return el.setAttribute("aria-pressed",tog(de.intended,id));
 case "deinc":{if(id in de.inc)delete de.inc[id];else{de.inc[id]=1;de.intended=de.intended.filter(x=>x!==id)}return render()}
 case "decancel":editDoc=null;return render();
 case "desave":{const d=db.docs.find(x=>x.id===id);Object.assign(d,{state:de.state,concepts:de.concepts,intended:de.intended,incorporated:Object.entries(de.inc).map(([ref,cites])=>({ref,cites:+cites||0}))});touch(d);editDoc=null;changed();render();return toast("Texto atualizado")}
 case "dunlink":{if(!confirm("Desvincular este texto do aplicativo? O arquivo continua no Drive, sem nenhuma alteração."))return;const d=db.docs.find(x=>x.id===id);d.deleted=true;touch(d);editDoc=null;changed();render();return toast("Texto desvinculado")}
 case "export":{const c=C(id);toast("Gerando o Word…");await getToken(true);
  const ideas=L("ideas").filter(i=>i.concepts.includes(id)).sort((a,b)=>a.ts.localeCompare(b.ts)),docs=docsOf(id);
  const P=[{t:c.name,s:"title"},{t:"Exportado do Bloco Mágico em "+fmtFull(nowIso()),s:"meta"}];if(cheio(c.def)){P.push({t:"Minha definição ("+defEstado(c)+")",s:"h"});P.push({t:c.def,s:"p"});if(c.defSrc)P.push({t:"Apoiada em: "+c.defSrc,s:"meta"})}P.push({t:"Fragmentos",s:"h"});
  if(!ideas.length)P.push({t:"Nenhum fragmento.",s:"meta"});
  ideas.forEach(i=>{P.push({t:fmtFull(i.ts)+(i.moment?". "+i.moment:""),s:"meta"});P.push({t:i.text,s:"p"});const r=i.refId&&R(i.refId);if(r)P.push({t:"Procedência"+(r.type==="com"?" (comentador)":"")+": "+r.label,s:"meta"})});
  P.push({t:"Textos vinculados",s:"h"});if(!docs.length)P.push({t:"Nenhum texto vinculado.",s:"meta"});
  docs.forEach(d=>{P.push({t:d.name,s:"b"});P.push({t:"Estado: "+STATES[d.state]+". Citações: "+citeLine(d)+".",s:"meta"});P.push({t:driveLink(d),s:"meta"})});
  const r=await upload({name:`Exportação — ${c.name} — ${todayIso()}.docx`,parents:[await subFolder("Exportações")]},await buildDocx(P));
  exportLinks[id]=r.webViewLink;render();return toast("Word salvo no Drive, em Bloco Mágico / Exportações.")}
 case "lopen":link={cid:route.id,mode:"search",q:"",results:null,file:null,text:null,sel:[route.id],title:"",state:"sem",focus:true};render();return scrollPanel();
 case "lclose":link=null;err="";return render();
 case "lmode":Object.assign(link,{mode:el.dataset.m,file:null,title:"",sel:[link.cid],focus:true});err="";render();return scrollPanel();
 case "lpick":{const f=link.results.find(x=>x.id===id);Object.assign(link,{file:f,text:null,title:cleanTitle(f.name),sel:[link.cid],state:"sem"});err="";render();scrollPanel();
  let t="";try{t=await fileText(f)}catch(e){}if(link&&link.file===f){link.text=t;const ex=$("#lex"),ch=$("#lchips");if(ex)ex.innerHTML=exHtml(t);if(ch)ch.innerHTML=lChips()}return}
 case "lback":link.file=null;link.focus=true;err="";return render();
 case "ltog":if(id===link.cid)return toast("O conceito desta tela é o principal.");return el.setAttribute("aria-pressed",tog(link.sel,id));
 case "llink":{if(!link.title.trim()){err="Escreva um título curto.";return render()}await getToken(true);link.busy=true;render();const f=link.file,name=nameFor(link.cid,link.title,f.modifiedTime.slice(0,10),extOf(f));
  try{const m=await renameFile(f.id,name);db.docs.push(touch({id:uid("d"),fileId:f.id,name:m.name,oldName:f.name,main:link.cid,concepts:[...link.sel],title:link.title.trim(),date:f.modifiedTime.slice(0,10),state:link.state,intended:[],incorporated:[],citesFound:link.text?countCites(link.text):0,webViewLink:m.webViewLink||f.webViewLink}));
   link=null;err="";changed();render();return toast("Renomeado e vinculado")}catch(e){link.busy=false;err="Não foi possível renomear no Drive. Verifique a internet e tente de novo.";return render()}}
 case "lcreate":{if(!link.title.trim()){err="Escreva um título curto.";return render()}await getToken(true);link.busy=true;render();const name=nameFor(link.cid,link.title,todayIso(),".docx");
  try{const m=await upload({name,parents:[await subFolder("Textos")]},await buildDocx([{t:link.title.trim(),s:"title"},{t:"",s:"p"}]));
   db.docs.push(touch({id:uid("d"),fileId:m.id,name:m.name,oldName:"",main:link.cid,concepts:[link.cid],title:link.title.trim(),date:todayIso(),state:"sem",intended:[],incorporated:[],citesFound:0,webViewLink:m.webViewLink}));
   link=null;err="";changed();render();return toast("Documento criado no Drive e vinculado")}catch(e){link.busy=false;err="Não foi possível criar o documento. Verifique a internet e tente de novo.";return render()}}
 case "bfolder":{const f=batch.folders.find(x=>x.id===id);batch.folder=f;batch.step="files";batch.files=null;render();window.scrollTo(0,0);
  try{const linked=new Set(L("docs").map(d=>d.fileId));batch.files=(await listFiles(`'${f.id}' in parents and trashed=false and ${DOCQ}`,undefined,{orderBy:"name"})).filter(x=>!linked.has(x.id))}catch(e){batch.files=[];toast("Não foi possível ler a pasta.")}
  if(route.name==="batch")render();return}
 case "bfolders":batch.step="folders";batch.files=null;return render();
 case "bstart":Object.assign(batch,{step:"classify",queue:batch.files,idx:0,skipped:[],done:0});primeBatch();render();return window.scrollTo(0,0);
 case "btog":{tog(batch.sel,id);document.querySelectorAll('[data-a="btog"]').forEach(b=>b.setAttribute("aria-pressed",batch.sel.includes(b.dataset.id)));const n=$("#nn");if(n)n.textContent=bName();return}
 case "blink":{if(!batch.sel.length){err="Marque ao menos um conceito.";return render()}if(!batch.title.trim()){err="Escreva um título curto.";render();return $("#bt").focus()}
  await getToken(true);const f=batch.queue[batch.idx],name=bName();batch.busy=true;render();
  try{const m=await renameFile(f.id,name);db.docs.push(touch({id:uid("d"),fileId:f.id,name:m.name,oldName:f.name,main:batch.sel[0],concepts:[...batch.sel],title:batch.title.trim(),date:f.modifiedTime.slice(0,10),state:batch.state,intended:[],incorporated:[],citesFound:batch.text?countCites(batch.text):0,webViewLink:m.webViewLink||f.webViewLink}));
   batch.done++;batch.idx++;batch.busy=false;err="";changed();primeBatch();render();window.scrollTo(0,0);return toast("Renomeado e vinculado")}
  catch(e){batch.busy=false;err="Não foi possível renomear no Drive. Verifique a internet e tente de novo.";return render()}}
 case "bskip":batch.skipped.push(batch.queue[batch.idx]);batch.idx++;err="";primeBatch();render();return window.scrollTo(0,0);
 case "brevisit":Object.assign(batch,{queue:batch.skipped,skipped:[],idx:0});primeBatch();return render();
 case "newref":showNewRef=!showNewRef;showBulk=false;render();return $("#rl")&&$("#rl").focus();
 case "bulkref":showBulk=!showBulk;showNewRef=false;render();return $("#rb")&&$("#rb").focus();
 case "mkref":{const v=$("#rl").value.trim();if(!v)return toast("Digite autor e obra.");db.refs.push(touch({id:uid("r"),type:$("#rt").value,label:v}));showNewRef=false;changed();render();return toast("Obra cadastrada")}
 case "mkbulk":{const type=$("#rbt").value,have=new Set(L("refs").map(r=>fold(r.label)));const lines=$("#rb").value.split("\n").map(s=>s.trim()).filter(s=>s&&!have.has(fold(s)));
  if(!lines.length)return toast("Nenhuma obra nova na lista.");lines.forEach(label=>db.refs.push(touch({id:uid("r"),type,label})));showBulk=false;changed();render();return toast(`${lines.length} ${lines.length===1?"obra cadastrada":"obras cadastradas"}`)}
 case "rdel":{const r=R(id);if(!confirm(`Excluir "${r.label}" da bibliografia?`))return;r.deleted=true;touch(r);changed();render();return toast("Obra excluída")}
 default:return actPlano(a,el)
 }}catch(e){if(e.message==="auth"){toast("Conecte ao Drive tocando no aviso de sincronização.");render()}else toast(e.message||"Algo deu errado.")}}
function scrollPanel(){const p=$(".panel");if(p)p.scrollIntoView({block:"start",behavior:"smooth"})}
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&!el.disabled){e.preventDefault();act(el.dataset.a,el)}});
window.addEventListener("online",()=>{setSync();if(hasToken())sync(false)});
window.addEventListener("offline",setSync);
document.querySelectorAll(".mark[data-knot]").forEach(m=>m.innerHTML=KNOT);
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
