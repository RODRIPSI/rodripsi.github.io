<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181E;--surface:#1F232B;--ink:#E6E8EB;--muted:#9BA2AC;--rule:#343A45;--soft:#2A2F38;--focus:#76A8EA}}
:root[data-theme="dark"]{--bg:#15181E;--surface:#1F232B;--ink:#E6E8EB;--muted:#9BA2AC;--rule:#343A45;--soft:#2A2F38;--focus:#76A8EA}
html{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
.themebtn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;width:34px;height:30px;font-size:15px;color:var(--muted);margin-left:8px;flex:none;line-height:1}.side .themebtn{margin:0 0 18px 8px}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{min-height:100%}
.side{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.brand{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.01em}
.mark{width:34px;height:34px;flex:none;display:inline-block}.mark svg,.mark img{width:100%;height:100%;display:block}.mark img{border-radius:50%;filter:drop-shadow(0 0 6px rgba(228,38,42,.45))}.topbar{--kbg:var(--bg)}.side{--kbg:var(--surface)}
main{max-width:720px;margin:0 auto;padding:12px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 14px;font-size:13px;color:var(--muted);position:relative}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--ink)}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:11px;line-height:18px;font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:8px 0 18px}
.label{display:block;font-size:14px;font-weight:500;color:var(--muted);margin:22px 0 8px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
textarea{font-family:var(--serif);font-size:18px;line-height:1.6;resize:vertical;min-height:150px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip.sug{border-style:dashed;border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{flex:1}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:10px;background:var(--ink);color:var(--surface);padding:14px;font-weight:600;font-size:16px}
.secondary{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.err{font-size:14px;color:#B3261E;margin:8px 0 0}
.clist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.clist button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:16px 4px}
.cbar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.cname{font-family:var(--serif);font-size:20px;display:block}
.cmeta{font-size:14px;color:var(--muted)}
.idea{position:relative;background:var(--surface);border-radius:10px;padding:14px 16px 14px 22px;margin:0 0 12px;overflow:hidden}
.stripe{position:absolute;left:0;top:0;bottom:0;width:6px;display:flex;flex-direction:column}
.stripe span{flex:1}
.idea .when{font-size:13px;color:var(--muted);margin:0 0 6px}
.idea .txt{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0}
.idea .moment{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin:8px 0 0}
.idea .ref{font-size:13px;color:var(--muted);margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags i{width:7px;height:7px;border-radius:50%;display:inline-block}
.back{border:0;background:none;color:var(--muted);padding:6px 0;font-size:15px}
.chead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-left:6px solid;padding-left:14px;margin:10px 0 22px}
.chead h1{margin:0}
details.block{margin:0 0 18px}
details.block>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);margin-bottom:12px;font-weight:600}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;align-self:center;margin-right:4px}
details.block[open]>summary::before{transform:rotate(45deg)}
.count{font-weight:400;color:var(--muted)}
.doc{background:var(--surface);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.doc .fname{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.state{display:inline-block;font-size:13px;border:1px solid var(--rule);border-radius:6px;padding:2px 8px}
.doc dl{margin:10px 0 0;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.doc dt{color:var(--muted)}
.doc dd{margin:0}
.doc .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.day{font-size:14px;font-weight:600;color:var(--muted);margin:22px 0 10px;text-transform:none}
.day:first-of-type{margin-top:0}
.empty{background:var(--surface);border-radius:10px;padding:22px;color:var(--muted);text-align:center}
.foot{margin-top:28px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:8px 10px;margin-top:22px}
@media (min-width:1100px){
 .app{display:grid;grid-template-columns:260px 1fr}
 .topbar,.tabs{display:none}
 .side{display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100%;overflow-y:auto;border-right:1px solid var(--rule);padding:24px 18px;background:var(--surface)}
 .side .topb{display:flex;align-items:center;gap:10px;margin-bottom:26px}
 .side nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:15px}
 .side nav button[aria-current="true"]{background:var(--soft);font-weight:600}
 .side .sub{font-size:13px;font-weight:500;color:var(--muted);margin:22px 10px 6px}
 .side .cl button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:15px}
 .side .cl button[aria-current="true"]{background:var(--soft)}
 main{padding:36px 44px 48px;max-width:760px;margin:0}
 .toast{bottom:28px}
}
.excerpt{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--muted);margin:0}
.rename{background:var(--surface);border-radius:10px;padding:12px 16px;margin-top:22px}
.rename .old{margin:0;font-size:14px;color:var(--muted);text-decoration:line-through}
.rename .new{margin:4px 0 0;font-family:var(--serif);font-size:17px}
.progress{height:4px;background:var(--rule);border-radius:2px;margin:0 0 18px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink)}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.res{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:10px}
.res .fname{font-size:16px;margin:0 0 4px}
.res .excerpt{font-size:14px}
mark{background:#F2D98A;color:#1D2330;border-radius:3px;padding:0 2px}
.panel{background:var(--surface);border-radius:10px;padding:16px;margin:0 0 12px;border:1px solid var(--rule)}
.panel .rename{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.syncbtn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);margin-left:auto;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .syncbtn{margin:0 0 18px;max-width:100%;text-align:left}
.warn{background:#FBE9E7;color:#8A1F17;border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A2220;color:#F2B8B0}}
:root[data-theme="dark"] .warn{background:#3A2220;color:#F2B8B0}
.idea .acts{margin-top:8px}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.incrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
input.cites{width:90px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
textarea.small{min-height:110px;font-size:16px}
.primary[disabled]{opacity:.6}
a{color:inherit}

:root[data-theme="dark"]{--bg:#0B0E14;--surface:#141923;--ink:#E7EAF0;--muted:#98A1B1;--rule:#252D3C;--soft:#1C2330;--focus:#7F9FE6;--accent:#7F9FE6;--c-q:#E79A4E;--c-d:#5DBB8E;--c-c:#B39AD9;--c-x:#F06B5B}

.a-img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:var(--surface);margin:0 0 14px}
.a-img.big{max-height:520px}.a-img.md{max-height:230px;width:auto;max-width:100%;display:block;margin:0 auto;border-radius:12px}.a-ph.md{height:150px}.a-ph{display:grid;place-items:center;text-align:center;padding:12px;height:220px;color:var(--muted);font-size:14px;border:1px dashed var(--rule)}
.a-imgs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.a-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
@media (max-width:620px){.a-cols,.a-imgs{grid-template-columns:1fr}}
.a-col{overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px}.a-col.vazio{border-style:dashed;background:none}
.a-h{font-family:var(--serif);font-size:19px;margin:0 0 10px}.a-h span{font-family:var(--sans);font-size:13px;color:var(--muted)}
.a-doc{display:inline-block;text-decoration:none}
.a-l{font-size:14px;margin:10px 0 0}.a-l b{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.a-obs{font-size:13.5px;color:var(--muted);border-left:3px solid var(--rule);padding-left:9px;margin:10px 0 0}
.a-texto{margin-top:12px;max-height:60vh;overflow-y:auto;font-family:var(--serif);font-size:15.5px;line-height:1.6;border-top:1px solid var(--rule);padding-top:10px}
.f-sym .f-s,.f-op .f-s{font-family:var(--serif);font-size:24px;margin:0;line-height:1.3;overflow-wrap:anywhere}
.f-l{margin:4px 0 0;font-size:14.5px;color:var(--muted)}
.f-g summary{display:flex;justify-content:space-between;gap:12px;align-items:center;cursor:pointer;list-style:none;font-size:16px}
.f-g summary::-webkit-details-marker{display:none}.f-gs{font-family:var(--serif);font-size:20px;flex:none}
.f-op{border-top:1px solid var(--rule);margin-top:14px;padding-top:12px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.f-img{position:relative;display:flex;flex-direction:column;gap:6px;border:2px solid var(--rule);border-radius:10px;background:var(--surface);padding:8px;text-align:left}
.f-img[aria-pressed="true"]{border-color:var(--ink)}.f-img img{width:100%;height:120px;object-fit:contain;background:#fff;border-radius:6px}
.f-img span{font-size:12.5px;color:var(--muted);line-height:1.35}
.f-img i{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-style:normal;font-size:12px}
.f-img[aria-pressed="false"] i{background:var(--surface);border:2px solid var(--rule)}
.idea .a-img{max-height:360px;margin:4px 0 10px}
.d-nd{flex:none;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--soft);color:var(--ink)}
.d-outro a{text-decoration:underline;text-underline-offset:3px}.d-outro{flex-wrap:wrap}
.d-no{width:100%;border:0;background:none;text-align:left;cursor:pointer;font:inherit;color:inherit}.d-no small{color:var(--accent)}
.d-missinfo{margin:4px 0 10px 34px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 8px 8px 0;font-size:14.5px;line-height:1.5}
.d-chev{flex:none;color:var(--muted);transition:transform .15s}.d-head[aria-expanded="true"] .d-chev{transform:rotate(180deg)}
.d-q{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--c-q) 9%,var(--surface))}.d-q small,.d-blk small,.d-lab{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}.d-q small{color:var(--c-q)}
.d-q p,.d-blk p{margin:0;font-family:var(--serif);line-height:1.55}.d-q p{font-size:17.5px}.d-blk{margin-top:14px}.d-blk p{font-size:16px}
.d-eixos{display:flex;flex-wrap:wrap;gap:7px}.d-eixos span{padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);font-size:14.5px;line-height:1.35}
.d-lab{margin-top:14px}.d-drow{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px dashed var(--rule)}
.d-drow a{flex:1;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;text-decoration:none;color:var(--ink);font-size:15.5px;flex-wrap:wrap}.d-drow a span{text-decoration:underline;text-underline-offset:3px}.d-drow small{color:var(--muted);font-size:13px}
.d-x{flex:none;width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--c-x)}
.d-undo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:14.5px;line-height:1.45}.d-undo .secondary{flex:none}
.d-mais{display:inline-flex;align-items:center;gap:6px}.d-menu{margin-top:8px;border:1px solid var(--rule);border-radius:12px;overflow:hidden;max-width:420px}
.d-menu>button{display:block;width:100%;min-height:48px;padding:0 16px;border:0;border-bottom:1px solid var(--rule);background:var(--surface);text-align:left;font-size:15px;color:var(--ink)}.d-menu>button:last-child{border-bottom:0}.d-menu .d-del{color:var(--c-x)}
.d-przbox{padding:10px 14px;border-bottom:1px solid var(--rule)}.d-ed{margin-top:10px}.d-ed textarea{width:100%}.d-lq{color:var(--c-q)}.d-out{border-color:var(--accent);color:var(--accent)}
.d-link{margin:10px 0;padding:10px;border:1px solid var(--accent);border-radius:10px}
.d-loose{margin:0;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--rule)}
.d-wrap{flex-wrap:wrap}.d-wrap input{flex:1 1 150px}
input[type=date]{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}

:root[data-theme="dark"]{--bg:#090406;--surface:#120A0C;--ink:#F2E8DC;--muted:#B9A697;--rule:#4B3420;--soft:#22120F;--focus:#E6B45A;--accent:#D9B060;--gold:#D9B060;--gold2:#F0D58A;--red1:#E2291F;--red2:#8E0F0F}
:root[data-theme="dark"] body{background:radial-gradient(900px 520px at 50% -12%,rgba(150,10,10,.30),transparent 72%),#090406}
:root[data-theme="dark"] .app{position:relative;z-index:1}
:root[data-theme="dark"] #arte{display:block;position:absolute;left:0;right:0;top:0;aspect-ratio:3/1;z-index:0;pointer-events:none;background:linear-gradient(180deg,rgba(9,4,6,.22) 0%,rgba(9,4,6,0) 40%,rgba(9,4,6,.80) 84%,#090406 100%),var(--arteA) center top/100% 100% no-repeat,#090406}
:root[data-theme="dark"] #arte[data-v="b"]{background:linear-gradient(180deg,rgba(9,4,6,.22) 0%,rgba(9,4,6,0) 40%,rgba(9,4,6,.80) 84%,#090406 100%),var(--arteB) center top/100% 100% no-repeat,#090406}
:root[data-theme="dark"] .topbar,:root[data-theme="dark"] main{position:relative;z-index:1}
:root[data-theme="dark"] main{padding-top:clamp(120px,17vw,230px)}
:root[data-theme="dark"] #arte-pe{display:block;height:50px;margin-top:auto;background:linear-gradient(180deg,#090406,rgba(9,4,6,0) 45%),var(--artePe) center bottom/100% 100% no-repeat;pointer-events:none;border-radius:0 0 17px 17px}
:root[data-theme="dark"] .col{display:flex;flex-direction:column;min-height:100vh}
:root[data-theme="dark"] main{flex:1;width:100%;box-sizing:border-box}
@media (min-width:600px){:root[data-theme="dark"] .col{margin:12px 12px 12px 0;min-height:calc(100vh - 24px);border:1px solid rgba(217,176,96,.55);border-radius:18px;box-shadow:inset 0 0 70px rgba(130,6,6,.28),0 0 0 1px #000}
 :root[data-theme="dark"] #arte{border-radius:17px 17px 0 0}}
@media (max-width:599px){:root[data-theme="dark"] #arte{aspect-ratio:auto;height:215px;background-size:100% 100%,cover,auto}:root[data-theme="dark"] main{padding-top:110px}:root[data-theme="dark"] #arte-pe{margin-bottom:62px}}

:root[data-theme="dark"] .syncbtn,:root[data-theme="dark"] .themebtn{background:rgba(10,5,6,.78);border:1px solid rgba(217,176,96,.7);color:#F0E2CC;box-shadow:0 0 14px rgba(200,20,10,.28)}
:root[data-theme="dark"] .themebtn{color:var(--gold2)}
:root[data-theme="dark"] .primary,:root[data-theme="dark"] .chip[aria-pressed="true"]{background:linear-gradient(180deg,var(--red1),var(--red2));color:#FBE9D8;border:1px solid rgba(255,150,110,.55);box-shadow:0 0 22px rgba(226,41,31,.45),inset 0 1px 0 rgba(255,210,180,.40)}

 const P=p=>{const[sz,b,i,before,after]={title:[36,1,0,0,120],h:[28,1,0,360,160],b:[24,1,0,120,40],p:[24,0,0,0,80],meta:[20,0,1,0,60]}[p.s]||[24,0,0,0,80];
  const txt=clean(p.t).split("\n").map(esc).join('</w:t></w:r><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="'+sz+'"/></w:rPr><w:br/><w:t xml:space="preserve">');
  return `<w:p><w:pPr><w:spacing w:before="${before}" w:after="${after}"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${b?"<w:b/>":""}${i?"<w:i/>":""}<w:sz w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${txt}</w:t></w:r></w:p>`};
 const z=new JSZip();z.file("[Content_Types].xml",CT);z.file("_rels/.rels",RELS);

let syncing=false,syncErr=false,syncTimer=null,lastSync=null,dirty=false;
try{dirty=localStorage.getItem("bm-dirty")==="1"}catch(e){}
function setDirty(v){dirty=v;try{localStorage.setItem("bm-dirty",v?"1":"0")}catch(e){}setSync()}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),2500)}
function syncText(){
 if(syncing)return "Sincronizando…";
 if(!navigator.onLine)return "Sem internet, salvo no aparelho";
 if(syncErr)return "Falha ao sincronizar. Toque para tentar";
 if(!hasToken())return lastSync?"Toque para sincronizar":"Toque para conectar ao Drive";
 if(dirty)return "Enviando alterações…";
 return lastSync?`Sincronizado às ${fmtTime(lastSync)}`:"Conectado ao Drive"}
const temaAtual=()=>document.documentElement.getAttribute("data-theme")==="light"?"light":"dark";
function aplicarTema(t){document.documentElement.setAttribute("data-theme",t);const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==="dark"?"#090406":"#EEF0F4";document.querySelectorAll(".themebtn").forEach(b=>{b.textContent=t==="dark"?"☀":"☾";b.title=t==="dark"?"Mudar para o tema claro":"Mudar para o tema escuro"})}
function alternarTema(){const t=temaAtual()==="dark"?"light":"dark";try{localStorage.setItem("bm-theme",t)}catch(e){}aplicarTema(t)}
function setSync(){aplicarTema(temaAtual());document.querySelectorAll(".syncbtn").forEach(b=>b.textContent=syncText())}
async function sync(interactive){
 if(syncing)return;
 if(!navigator.onLine){setSync();if(interactive)toast("Sem internet. Tudo continua salvo no aparelho.");return}
 if(!interactive&&!hasToken()){setSync();return}
 syncing=true;syncErr=false;setSync();
 const before=JSON.stringify(db);
 try{
  await getToken(interactive);
  const folder=await appFolder();
  const found=await listFiles(`name='${DATA_NAME}' and '${folder}' in parents and trashed=false`,"files(id)");
  const fileId=found[0]&&found[0].id;let remote=null;
  if(fileId)remote=await(await api(`drive/v3/files/${fileId}?alt=media`)).json();
  const merged=remote?merge(db,remote):JSON.parse(JSON.stringify(db));
  const today=todayIso();
  if(remote&&(!merged.meta.lastBackup||(new Date(today)-new Date(merged.meta.lastBackup))/864e5>=7)){
   await upload({name:`backup-${today}.json`,parents:[folder]},new Blob([JSON.stringify(remote)],{type:"application/json"}));merged.meta.lastBackup=today}
  const blob=new Blob([JSON.stringify(merged)],{type:"application/json"});
  if(fileId)await upload({},blob,fileId);else await upload({name:DATA_NAME,parents:[folder]},blob);
  const editedMeanwhile=JSON.stringify(db)!==before;
  db=merge(db,merged);saveLocal();lastSync=new Date();
  if(editedMeanwhile){dirty=true;scheduleSync()}else setDirty(false);
  if(JSON.stringify(db)!==before)softRender();
 }catch(e){
  if(e.message!=="auth"){syncErr=true;if(interactive)toast("Não foi possível sincronizar. Tudo continua salvo no aparelho.")}
  else if(interactive)toast("Login não concluído. Toque de novo para conectar.");
 }finally{syncing=false;setSync();if(route.name==="batch"||link)softRender();if(route.name==="diss"&&hasToken()&&db.meta.dissFolder&&!dscan)scanDiss(false)}}

function parsePadrao(name){
 const base=name.replace(/\.(docx?|odt)$/i,""),parts=base.split(/\s[—–-]\s/);
 if(parts.length<3)return null;const date=parts[parts.length-1].trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;
 const cname=parts[0].trim(),title=parts.slice(1,-1).join(" — ").trim();if(!cname||!title)return null;return{cname,title,date}}

async function scanAuto(){

 try{
  const names=L("concepts").map(c=>c.name.trim()).filter(Boolean),qs_=[`trashed=false and ${DOCQ} and name contains '—'`];
  for(let i=0;i<names.length;i+=12)qs_.push(`trashed=false and ${DOCQ} and (${names.slice(i,i+12).map(n=>`name contains '${qesc(n)}'`).join(" or ")})`);
  const seen=new Map();
  for(const q of qs_){try{(await listFiles(q)).forEach(f=>seen.set(f.id,f))}catch(e){if(e.message==="auth")throw e}}
  const linked=new Set(L("docs").map(d=>d.fileId));
  auto.found=[...seen.values()].filter(f=>!linked.has(f.id)).map(f=>{const p=parsePadrao(f.name);if(!p)return null;const c=conceptByName(p.cname);return{f,...p,cid:c?c.id:null}}).filter(Boolean)
   .sort((a,b)=>a.cname.localeCompare(b.cname,"pt")||a.title.localeCompare(b.title,"pt"));
  auto.jaVinc=[...seen.values()].filter(f=>linked.has(f.id)&&parsePadrao(f.name)).length;
 }catch(e){auto.err=e.message==="auth"?"Conecte ao Drive de novo.":"Não foi possível buscar no Drive. Verifique a internet."}
 auto.loading=false;if(route.name==="auto")render()}

${nota}

${guia}`}

async function desenhosDocx(ab){

 const rels=P.parseFromString(await z.file("word/_rels/document.xml.rels").async("string"),"application/xml");
 const alvo=Object.fromEntries(tags(rels,"Relationship").map(r=>[r.getAttribute("Id"),r.getAttribute("Target")]));
 const doc=P.parseFromString(await z.file("word/document.xml").async("string"),"application/xml");
 const ps=tags(doc,"p"),txt=p=>tags(p,"t").map(t=>t.textContent).join("").trim(),out=[],vistos=new Set();let pulados=0;
 for(let i=0;i<ps.length;i++){for(const b of tags(ps[i],"blip")){
  const rid=b.getAttribute("r:embed")||([...b.attributes].find(a=>a.localName==="embed")||{}).value,t=alvo[rid];if(!t||vistos.has(t))continue;vistos.add(t);
  const path="word/"+t.replace(/^\.?\//,""),ext=(t.match(/\.(\w+)$/)||[])[1]||"";
  if(!/^(png|jpe?g|gif|webp)$/i.test(ext)){pulados++;continue}
  const f=z.file(path);if(!f)continue;
  let cap="";for(const j of [i+1,i+2,i-1])if(ps[j]&&/^figura/i.test(txt(ps[j]))){cap=txt(ps[j]);break}
  let expl="";if(cap){const k=ps.indexOf(ps[i+1]&&/^figura/i.test(txt(ps[i+1]))?ps[i+1]:ps[i+2]);if(k>0&&ps[k+1]&&!tags(ps[k+1],"blip").length)expl=txt(ps[k+1])}
  const blob=new Blob([await f.async("arraybuffer")],{type:"image/"+(ext.toLowerCase()==="jpg"?"jpeg":ext.toLowerCase())});
  out.push({url:URL.createObjectURL(blob),blob,ext,cap,expl,sel:true})}}
 return {imgs:out,pulados}}

function blocosDocx(xml){
  const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const doc=new DOMParser().parseFromString(xml,"application/xml"), body=doc.getElementsByTagNameNS(W,"body")[0];
  const txt=el=>{ let t=""; const walk=n=>{ for(const c of n.childNodes){ if(c.namespaceURI!==W) continue;
      if(c.localName==="t") t+=c.textContent; else if(c.localName==="tab") t+=" "; else if(c.localName==="br") t+="\n";
      else if(c.localName==="p"){ if(t&&!t.endsWith("\n")) t+="\n"; walk(c); } else walk(c); } };
    walk(el); return t.split("\n").map(x=>x.replace(/[ \t]+/g," ").trim()).filter(Boolean).join("\n"); };
  const out=[];
  for(const el of body.childNodes){
    if(el.namespaceURI!==W) continue;
    if(el.localName==="p"){ const st=el.getElementsByTagNameNS(W,"pStyle")[0]; const t=txt(el); if(t) out.push({tipo:"p",t,est:st?st.getAttributeNS(W,"val")||st.getAttribute("w:val")||"":""}); }
    if(el.localName==="tbl"){
      const rows=[...el.childNodes].filter(r=>r.localName==="tr").map(r=>[...r.childNodes].filter(c=>c.localName==="tc").map(txt));
      if(rows.length===1&&rows[0].length===1) out.push({tipo:"p",t:rows[0][0],est:"caixa"});
      else if(rows.length&&rows.every(r=>r.length===1)) rows.forEach(r=>r[0]&&out.push({tipo:"p",t:r[0],est:"caixa"}));
      else out.push({tipo:"tab",rows});
    }
  }
  return out;
}
function interpretarEsquema(bl){
  const pl=planoVazio(); pl.checklist=[]; const sobra=[]; let titulo="", numero="";
  const rot=(t,r)=>{ const m=t.match(new RegExp("^"+r+"\\s*:?\\s*","i")); return m?t.slice(m[0].length).trim():null; };
  const eTitulo=b=>b.tipo==="p"&&(/heading|t[íi]tulo/i.test(b.est)||/^\d{1,2}\.\s+\S/.test(b.t))&&b.t.length<140;
  let secao="", demo=null;
  const demoN=k=>{ while(pl.demos.length<k) pl.demos.push({nome:"",insuf:"",pergunta:"",conceitos:"",descoberta:"",naoDemonstra:"",noinsu:"",passagens:[],pars:[]}); return pl.demos[k-1]; };
  for(const b of bl){
    if(b.tipo==="p"){
      const t=b.t, mSub=t.match(/^Subt[íi]tulo\s+(\d+\.\d+)/i); if(mSub&&!numero){ numero=mSub[1]; continue; }
      if(eTitulo(b)){
        const md=t.match(/Demonstra[çc][ãa]o\s+(\d+)\s*[—–-]\s*(.+)$/i);
        if(md){ secao="demo"; demo=demoN(+md[1]); if(!demo.nome) demo.nome=md[2].trim(); continue; }
        if(!(/heading\s*1|t[íi]tulo\s*1/i.test(b.est)||/^\d{1,2}\.\s/.test(t))) continue; // subtítulo interno (ex.: Quadro dos parágrafos)
        demo=null;
        secao=/sequ[êe]ncia cont[íi]nua/i.test(t)?"seq":/regras espec/i.test(t)?"regras":/checklist/i.test(t)?"chk":/modelos/i.test(t)?"modelos":"outro"; continue;
      }
      let v;
      if((v=rot(t,"T[íi]tulo provis[óo]rio"))!==null){ titulo=v.replace(/^\d+\.\d+\s*/,""); const m=v.match(/^(\d+\.\d+)/); if(m&&!numero) numero=m[1]; continue; }
      if(!demo){
        if((v=rot(t,"Pergunta organizadora"))!==null){ pl.ficha.pergunta=v; continue; }
        if((v=rot(t,"Hip[óo]tese do subt[íi]tulo"))!==null){ pl.ficha.hipotese=v; continue; }
        if((v=rot(t,"Fun[çc][ãa]o no cap[íi]tulo[^:]*"))!==null){ pl.ficha.funcao=v; continue; }
        if((v=rot(t,"Conquista final"))!==null){ pl.ficha.conquista=v; continue; }
        if((v=rot(t,"NOINSU final"))!==null){ pl.ficha.noinsu=v; continue; }
      } else {
        if((v=rot(t,"Pergunta"))!==null){ demo.pergunta=v; continue; }
        if((v=rot(t,"Conceitos(\\/opera[çc][õo]es)?"))!==null){ demo.conceitos=v; continue; }
        if((v=rot(t,"O que n[ãa]o demonstra"))!==null){ demo.naoDemonstra=v; continue; }
        if((v=rot(t,"NOINSU"))!==null){ demo.noinsu=v; continue; }
      }
      if(demo&&(v=rot(t,"Resultado necess[áa]rio"))!==null){ demo.resultado=v; continue; }
      if(demo&&(v=rot(t,"L[óo]gica geral"))!==null){ demo.logica=v; continue; }
      if(/^(M[ée]todo aplicado|Resultado necess[áa]rio|L[óo]gica geral|Controle documental|Estado do planejamento|Uso correto)/i.test(t)){ if(secao!=="modelos") sobra.push(t); continue; }
      if(secao==="seq"){ pl.sequencia+=(pl.sequencia?"\n":"")+t; continue; }
      if(secao==="regras"){ pl.regras+=(pl.regras?"\n":"")+t; continue; }
      if(secao==="chk"){ t.split("\n").filter(Boolean).forEach(x=>pl.checklist.push({t:x.trim(),ok:false})); continue; }
      if(secao==="modelos") continue;
      continue;
    }
    // tabelas
    const h=b.rows[0].map(x=>x.toLowerCase()), corpo=b.rows.slice(1);
    const col=nome=>h.findIndex(x=>x.includes(nome));
    if(col("passagem")>=0&&col("uso")>=0){
      corpo.forEach(r=>{ const k=parseInt(r[col("demonstra")>=0?col("demonstra"):0])||1; demoN(k).passagens.push({texto:r[col("texto")]||"",passagem:r[col("passagem")]||"",pagina:r[col("página")>=0?col("página"):col("pagina")]||"",uso:r[col("uso")]||"",conferida:false}); });
    } else if(col("insufici")>=0&&col("descoberta")>=0){
      corpo.forEach(r=>{ const m=(r[0]||"").match(/^(\d+)\s*[—–-]?\s*(.*)$/); if(!m) return; const d=demoN(+m[1]);
        d.nome=d.nome||m[2].trim(); d.insuf=r[col("insufici")]||""; d.pergunta=r[col("pergunta")]||d.pergunta; d.descoberta=r[col("descoberta")]||""; const ni=h.findIndex(x=>x.includes("nova insufici")); if(ni>=0) d.noinsu=r[ni]||d.noinsu; });
    } else if(col("etapa")>=0&&col("fun")>=0&&demo){
      corpo.forEach(r=>{ demo.pars.push({etapas:(r[col("etapa")]||"").toUpperCase().split(/[^A-Z]+/).filter(e=>ETAPAS.includes(e)),funcao:r[col("fun")]||"",recebe:r[col("recebe")]||"",entrega:r[col("entrega")]||"",frase:r[col("frase")>=0?col("frase"):col("estrutura")]||""}); });
    } else if(secao!=="modelos") sobra.push("Tabela não reconhecida: "+b.rows[0].join(" | "));
  }
  if(!pl.checklist.length) pl.checklist=CHECK_PADRAO.map(t=>({t,ok:false}));
  return {pl,sobra,titulo,numero};
}

let bq="",bIdx=null,lvUp=null; // bIdx={bookId,raw:[...],fold:[...],done,total} · lvUp={loading,nome}
function idbLivros(){return new Promise((res,rej)=>{const r=indexedDB.open("bm-livros",1);r.onupgradeneeded=()=>r.result.createObjectStore("txt");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

function textoPagina(tc){return tc.items.map(i=>(i.str||"")+(i.hasEOL?"\n":"")).join("").normalize("NFC").replace(/(\p{L})-\s*\n\s*(\p{L})/gu,"$1$2").replace(/\s+/g," ").trim()}
async function indexarLivro(){const b=book(route.k);if(!b||!rd.doc||rd.bookId!==b.id)return;

 const n=rd.doc.numPages,chave=b.fileId+"|"+n,guardado=await idbGet(chave);
 if(guardado&&guardado.length===n){bIdx={bookId:b.id,raw:guardado,fold:guardado.map(fold),done:n,total:n};return mostrarBusca()}
 bIdx={bookId:b.id,raw:[],fold:[],done:0,total:n,running:true};mostrarBusca();
 for(let p=1;p<=n;p++){if(!bIdx||bIdx.bookId!==b.id||rd.bookId!==b.id)return;
  try{const pg=await rd.doc.getPage(p),t=textoPagina(await pg.getTextContent());bIdx.raw[p-1]=t;bIdx.fold[p-1]=fold(t)}catch(e){bIdx.raw[p-1]="";bIdx.fold[p-1]=""}
  bIdx.done=p;if(p%8===0||p===n)mostrarBusca()}
 bIdx.running=false;idbSet(chave,bIdx.raw);mostrarBusca()}

 for(let i=0;i<bIdx.done;i++){const f=bIdx.fold[i];if(!f)continue;let k=f.indexOf(q);while(k>=0){tot++;if(out.length<300){const r=bIdx.raw[i],a=Math.max(0,k-70),z=Math.min(r.length,k+q.length+70);out.push({p:i+1,s:(a?"…":"")+esc(r.slice(a,k))+"<mark>"+esc(r.slice(k,k+q.length))+"</mark>"+esc(r.slice(k+q.length,z))+(z<r.length?"…":"")})}k=f.indexOf(q,k+q.length)}}

function promptLeitura(){
 return `Você ajuda um leitor de textos de psicanálise a entender uma passagem difícil. Ele é a única autoridade sobre a interpretação; você só reformula e explica, nunca acrescenta o que o texto não diz.
Regras:
- Reescreva a passagem de forma mais clara e direta, desfazendo frases longas e invertidas, sem trocar o vocabulário técnico por termos vagos.
- Depois, em uma ou duas frases, explique o que a passagem quer dizer, só com base no que está nela.
- Se a passagem depender claramente de algo dito antes, que não está no trecho, diga isso em vez de adivinhar.
- Nunca invente uma citação, uma fonte, ou uma ideia que não esteja no trecho. Nunca decida o que o trecho "realmente quer dizer" além do que ele autoriza.
- Responda em português, direto, sem introduções como "Claro" ou "Aqui está".

REESCRITA: <a passagem reescrita>
SIGNIFICADO: <a explicação em 1-2 frases>`}

/* ---------- Comentários da orientadora: lê os comentários de margem de um Word ---------- */
let comQ="",comRes=null,comOpenId=null,comFiltro="pendentes";
function comdocOf(id){return L("comdocs").find(c=>c.id===id)}
function comContagem(c){const n=(c.comentarios||[]).length,r=(c.comentarios||[]).filter(x=>x.resolvido).length;return{n,r}}
function esconderXml(t){return String(t||"").replace(/<[^>]+>/g,"").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&").trim()}
function comentariosDoDocx(xml,docXml){
 const comBlocos=[...xml.matchAll(/<w:comment\s+([^>]*)>([\s\S]*?)<\/w:comment>/g)];
 const map=new Map();
 comBlocos.forEach(([,attrs,body])=>{
  const id=(attrs.match(/w:id="(\d+)"/)||[])[1],autor=(attrs.match(/w:author="([^"]*)"/)||[])[1]||"",data=(attrs.match(/w:date="([^"]*)"/)||[])[1]||"";
  const texto=esconderXml([...body.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(m=>m[1]).join(""));
  if(id!=null)map.set(id,{id,autor,data,comentario:texto})});
 // âncoras no document.xml: texto entre commentRangeStart e commentRangeEnd do mesmo id
 const anchors={};
 map.forEach((v,id)=>{
  const ini=docXml.indexOf(`<w:commentRangeStart w:id="${id}"/>`);const fim=docXml.indexOf(`<w:commentRangeEnd w:id="${id}"/>`);
  if(ini>=0&&fim>ini){const frag=docXml.slice(ini,fim);anchors[id]=esconderXml([...frag.matchAll(/<w:t[^>]*>([\s\S]*?)<\/w:t>/g)].map(m=>m[1]).join(""))}
  else anchors[id]=""});
 return [...map.values()].map(v=>({...v,ancora:anchors[v.id]||""})).sort((a,b)=>a.id-b.id)}
async function comCarregar(fid,nome){
 toast("Lendo os comentários…");
 try{if(!window.JSZip)throw new Error("Componente de Word ainda carregando.");
  const m=await(await api(`drive/v3/files/${fid}?fields=id,name,mimeType,webViewLink`)).json();
  const ab=await(await api(m.mimeType===GDOC?`drive/v3/files/${fid}/export?mimeType=${encodeURIComponent(DOCX)}`:`drive/v3/files/${fid}?alt=media`)).arrayBuffer();
  const z=await JSZip.loadAsync(ab);
  const cf=z.file("word/comments.xml");
  if(!cf){toast("Este documento não tem comentários do Word.");return}
  const cxml=await cf.async("string"),dxml=await z.file("word/document.xml").async("string");
  const lista=comentariosDoDocx(cxml,dxml);
  if(!lista.length){toast("Não encontrei comentários neste documento.");return}
  const existente=L("comdocs").find(x=>x.doc&&x.doc.id===fid);
  if(existente){const old=new Map((existente.comentarios||[]).map(x=>[x.id,x.resolvido]));existente.comentarios=lista.map(x=>({...x,resolvido:!!old.get(x.id)}));existente.doc={id:fid,name:m.name,webViewLink:m.webViewLink};touch(existente)}
  else{db.comdocs.push(touch({id:uid("cm"),nome:nome||m.name.replace(/\.docx?$/i,""),doc:{id:fid,name:m.name,webViewLink:m.webViewLink},comentarios:lista.map(x=>({...x,resolvido:false}))}))}
  changed();render();return toast(`${lista.length} comentários lidos`)}
 catch(e){toast(e.message==="auth"?"Conecte ao Drive de novo.":(e.message||"Não foi possível ler o documento."))}}

let dBuscaQ="";

 return (a?"…":"")+esc(texto.slice(a,k))+"<mark>"+esc(texto.slice(k,k+q.length))+"</mark>"+esc(texto.slice(k+q.length,z))+(z<texto.length?"…":"")}
function dBuscaResultados(){const q=fold(dBuscaQ.trim());if(q.length<3)return null;const out=[];
 const perg=db.meta.dissPergunta||"";if(fold(perg).includes(q))out.push({tipo:"Pergunta de pesquisa",trecho:dTrecho(perg,q),ir:null});
 L("chapters").forEach(c=>{if(c.title&&fold(c.title).includes(q))out.push({tipo:`Capítulo ${c.n}`,trecho:dTrecho(c.title,q),ir:null})});
 subsSorted().forEach(s=>{
  const campos=[["Título",s.title],["Objetivo",s.objetivo],["Eixos possíveis",s.eixos]];
  const p=planRec(s.n);if(p&&p.ficha.pergunta)campos.push(["Pergunta",p.ficha.pergunta]);
  campos.forEach(([rot,texto])=>{if(texto&&fold(texto).includes(q))out.push({tipo:`${s.n} · ${rot}`,trecho:dTrecho(texto,q),ir:{a:"dbuscasub",id:s.id}})});
  const r=L("rascunhos").find(x=>x.n===s.n);if(r)r.blocos.forEach(b=>{if(b.texto&&fold(b.texto).includes(q))out.push({tipo:`${s.n} · ${b.tipo} (escrito)`,trecho:dTrecho(b.texto,q),ir:{a:"escrever",k:s.n}})})});
