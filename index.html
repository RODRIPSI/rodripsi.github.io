<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloco Mágico</title>
<script>/* Bloco Mágico mora em /index.html, para não englobar o Consultório (/consultorio/). */if(location.pathname==="/")location.replace("/index.html"+location.search+location.hash);</script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ECEEEA">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#ECEEEA;--surface:#FFFFFF;--ink:#1D2330;--muted:#5C636E;--rule:#D3D7D0;--soft:#E2E6DF;--focus:#2F6FC0;
--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Literata",Georgia,"Times New Roman",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181E;--surface:#1F232B;--ink:#E6E8EB;--muted:#9BA2AC;--rule:#343A45;--soft:#2A2F38;--focus:#76A8EA}}
:root[data-theme="dark"]{--bg:#15181E;--surface:#1F232B;--ink:#E6E8EB;--muted:#9BA2AC;--rule:#343A45;--soft:#2A2F38;--focus:#76A8EA}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app{min-height:100%}
.side{display:none}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 4px;max-width:720px;margin:0 auto}
.brand{font-family:var(--serif);font-size:19px;font-weight:500;letter-spacing:.01em}
.mark{width:30px;height:30px;flex:none;display:inline-block}.mark svg{width:100%;height:100%;display:block}.topbar{--kbg:var(--bg)}.side{--kbg:var(--surface)}
main{max-width:720px;margin:0 auto;padding:12px 16px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs button{flex:1;border:0;background:none;padding:12px 4px 14px;font-size:13px;color:var(--muted);position:relative}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="true"]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--ink)}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:11px;line-height:18px;font-weight:600}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:8px 0 18px}
.label{display:block;font-size:14px;font-weight:500;color:var(--muted);margin:22px 0 8px}
textarea,input[type=text],select{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
textarea{font-family:var(--serif);font-size:18px;line-height:1.6;resize:vertical;min-height:150px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip.sug{border-style:dashed;border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted)}
.inline{display:flex;gap:8px;margin-top:10px}
.inline input{flex:1}
.primary{display:block;width:100%;margin-top:26px;border:0;border-radius:10px;background:var(--ink);color:var(--surface);padding:14px;font-weight:600;font-size:16px}
.secondary{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:9px 14px;font-size:14px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.err{font-size:14px;color:#B3261E;margin:8px 0 0}
.clist{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
.clist button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;padding:16px 4px}
.cbar{width:5px;align-self:stretch;border-radius:3px;flex:none}
.cname{font-family:var(--serif);font-size:20px;display:block}
.cmeta{font-size:14px;color:var(--muted)}
.idea{position:relative;background:var(--surface);border-radius:10px;padding:14px 16px 14px 22px;margin:0 0 12px;overflow:hidden}
.stripe{position:absolute;left:0;top:0;bottom:0;width:6px;display:flex;flex-direction:column}
.stripe span{flex:1}
.idea .when{font-size:13px;color:var(--muted);margin:0 0 6px}
.idea .txt{font-family:var(--serif);font-size:17px;line-height:1.6;margin:0}
.idea .moment{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15px;margin:8px 0 0}
.idea .ref{font-size:13px;color:var(--muted);margin:4px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
.tags span{display:inline-flex;align-items:center;gap:5px}
.tags i{width:7px;height:7px;border-radius:50%;display:inline-block}
.back{border:0;background:none;color:var(--muted);padding:6px 0;font-size:15px}
.chead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-left:6px solid;padding-left:14px;margin:10px 0 22px}
.chead h1{margin:0}
details.block{margin:0 0 18px}
details.block>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);margin-bottom:12px;font-weight:600}
details.block>summary::-webkit-details-marker{display:none}
details.block>summary::before{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;align-self:center;margin-right:4px}
details.block[open]>summary::before{transform:rotate(45deg)}
.count{font-weight:400;color:var(--muted)}
.doc{background:var(--surface);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.doc .fname{font-family:var(--serif);font-size:17px;margin:0 0 8px}
.state{display:inline-block;font-size:13px;border:1px solid var(--rule);border-radius:6px;padding:2px 8px}
.doc dl{margin:10px 0 0;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.doc dt{color:var(--muted)}
.doc dd{margin:0}
.doc .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.day{font-size:14px;font-weight:600;color:var(--muted);margin:22px 0 10px;text-transform:none}
.day:first-of-type{margin-top:0}
.empty{background:var(--surface);border-radius:10px;padding:22px;color:var(--muted);text-align:center}
.foot{margin-top:28px}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.proto{font-size:12px;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:8px 10px;margin-top:22px}
@media (min-width:768px){
 .app{display:grid;grid-template-columns:260px 1fr}
 .topbar,.tabs{display:none}
 .side{display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100%;overflow-y:auto;border-right:1px solid var(--rule);padding:24px 18px;background:var(--surface)}
 .side .topb{display:flex;align-items:center;gap:10px;margin-bottom:26px}
 .side nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:9px 10px;font-size:15px}
 .side nav button[aria-current="true"]{background:var(--soft);font-weight:600}
 .side .sub{font-size:13px;font-weight:500;color:var(--muted);margin:22px 10px 6px}
 .side .cl button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:7px 10px;font-size:15px}
 .side .cl button[aria-current="true"]{background:var(--soft)}
 main{padding:36px 44px 48px;max-width:760px;margin:0}
 .toast{bottom:28px}
}
.excerpt{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--muted);margin:0}
.rename{background:var(--surface);border-radius:10px;padding:12px 16px;margin-top:22px}
.rename .old{margin:0;font-size:14px;color:var(--muted);text-decoration:line-through}
.rename .new{margin:4px 0 0;font-family:var(--serif);font-size:17px}
.progress{height:4px;background:var(--rule);border-radius:2px;margin:0 0 18px;overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink)}
.seg{display:flex;border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:var(--surface);padding:10px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.res{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--bg);border-radius:10px;padding:12px 14px;margin-top:10px}
.res .fname{font-size:16px;margin:0 0 4px}
.res .excerpt{font-size:14px}
mark{background:#F2D98A;color:#1D2330;border-radius:3px;padding:0 2px}
.panel{background:var(--surface);border-radius:10px;padding:16px;margin:0 0 12px;border:1px solid var(--rule)}
.panel .rename{background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.syncbtn{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);margin-left:auto;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .syncbtn{margin:0 0 18px;max-width:100%;text-align:left}
.warn{background:#FBE9E7;color:#8A1F17;border-radius:8px;padding:8px 10px;font-size:14px;margin:0 0 10px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{background:#3A2220;color:#F2B8B0}}
:root[data-theme="dark"] .warn{background:#3A2220;color:#F2B8B0}
.idea .acts{margin-top:8px}
.row{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.incrow{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
input.cites{width:90px;padding:6px 8px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
textarea.small{min-height:110px;font-size:16px}
.primary[disabled]{opacity:.6}
a{color:inherit}

/* dissertação */
:root{--t-ok:#2E7D5B;--t-folga:#2E7D5B;--t-sem2:#A67C00;--t-sem1:#C8611A;--t-red:#C0392B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t-ok:#5DBB8E;--t-folga:#5DBB8E;--t-sem2:#E3C04A;--t-sem1:#EE9447;--t-red:#F06B5B}}
:root[data-theme="dark"]{--t-ok:#5DBB8E;--t-folga:#5DBB8E;--t-sem2:#E3C04A;--t-sem1:#EE9447;--t-red:#F06B5B}
.tabs.cinco button{font-size:12px;padding-left:2px;padding-right:2px}
.d-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.d-bar span{display:block;height:100%}.d-bar-ok{background:var(--t-ok)}.d-bar-and{background:var(--t-sem1)}
.d-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.d-stats div{border-top:1px solid var(--rule);padding-top:8px}
.d-stats b{display:block;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.2}
.d-stats span{font-size:12.5px;color:var(--muted)}
.d-alert{display:block;width:100%;text-align:left;border:0;border-radius:10px;padding:11px 14px;margin:0 0 8px;color:#fff;font-size:15px}
.d-alert.d-sem1{background:var(--t-sem1)}.d-alert.d-red,.d-alert.d-venc{background:var(--t-red)}
.d-sub{padding:0;border-left:5px solid var(--rule)}
.d-sub.d-b-ok,.d-sub.d-b-folga{border-left-color:var(--t-ok)}.d-sub.d-b-sem2{border-left-color:var(--t-sem2)}.d-sub.d-b-sem1{border-left-color:var(--t-sem1)}.d-sub.d-b-red,.d-sub.d-b-venc{border-left-color:var(--t-red)}
.d-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:14px 14px 14px 12px}
.d-num{font-family:var(--serif);font-size:20px;min-width:34px;color:var(--muted)}.d-num.ok{color:var(--t-ok)}
.d-tt{flex:1;min-width:0}.d-tt>span:first-child{display:block;font-family:var(--serif);font-size:17px;line-height:1.3}
.d-vazio{color:var(--muted);font-style:italic}
.d-meta{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.d-prazo{display:inline-block;color:#fff;font-weight:600;font-size:12px;border-radius:6px;padding:1px 7px;margin-left:4px}
.d-prazo.d-folga{background:var(--t-folga)}.d-prazo.d-sem2{background:var(--t-sem2)}.d-prazo.d-sem1{background:var(--t-sem1)}.d-prazo.d-red,.d-prazo.d-venc{background:var(--t-red)}
@keyframes dpisca{50%{opacity:.35}}
@media (prefers-reduced-motion:no-preference){.d-venc{animation:dpisca 1.1s ease-in-out infinite}}
.d-pips{display:flex;gap:4px;flex:none}.d-pips i{width:11px;height:22px;border-radius:3px;background:var(--soft)}.d-pips i.on{background:var(--t-ok)}
.d-body{border-top:1px solid var(--rule);padding:6px 16px 14px}
.d-docl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--rule);text-decoration:none;margin:0;font-size:15px}
.d-docl small{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right}
a.d-docl span:nth-child(2){text-decoration:underline;text-underline-offset:3px}
.d-ck{width:20px;height:20px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--t-ok);color:#fff}
.d-no .d-ck{background:none;border:2px solid var(--rule)}.d-no span:nth-child(2){color:var(--muted)}
.d-esq{background:var(--ink);color:var(--surface)}
.a-item{display:flex;align-items:center;gap:12px;margin-top:6px}.a-ck{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;font-weight:600}.a-item[aria-pressed="true"] .a-ck{background:var(--ink);color:var(--surface)}
.a-img{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:10px;background:var(--surface);margin:0 0 14px}
.a-img.big{max-height:520px}.a-ph{display:grid;place-items:center;height:220px;color:var(--muted);font-size:14px;border:1px dashed var(--rule)}
.a-imgs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.a-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
@media (max-width:620px){.a-cols,.a-imgs{grid-template-columns:1fr}}
.a-col{overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px}.a-col.vazio{border-style:dashed;background:none}
.a-h{font-family:var(--serif);font-size:19px;margin:0 0 10px}.a-h span{font-family:var(--sans);font-size:13px;color:var(--muted)}
.a-doc{display:inline-block;text-decoration:none}
.a-l{font-size:14px;margin:10px 0 0}.a-l b{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.a-obs{font-size:13.5px;color:var(--muted);border-left:3px solid var(--rule);padding-left:9px;margin:10px 0 0}
.a-texto{margin-top:12px;max-height:60vh;overflow-y:auto;font-family:var(--serif);font-size:15.5px;line-height:1.6;border-top:1px solid var(--rule);padding-top:10px}
.d-loose{margin:0;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--rule)}
.d-wrap{flex-wrap:wrap}.d-wrap input{flex:1 1 150px}
input[type=date]{width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js" defer></script>
</head>
<body>
<div class="app">
 <aside class="side" id="side"></aside>
 <div>
  <div class="topbar"><span class="mark" data-knot></span><span class="brand">Bloco Mágico</span><button class="syncbtn" data-a="sync"></button></div>
  <main id="main"></main>
 </div>
</div>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
const KNOT='<svg viewBox="140 36 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="190" cy="70" r="26" fill="none" stroke="#C8372D" stroke-width="7"/><circle cx="174" cy="98" r="26" fill="none" stroke="#2F6FC0" stroke-width="7"/><circle cx="206" cy="98" r="26" fill="none" stroke="#2E9A57" stroke-width="7"/>'+
[["M206.3 90.2 A26 26 0 0 1 192.2 95.9","#C8372D"],["M166.6 81.2 A26 26 0 0 1 164.3 66.2","#C8372D"],["M183.3 73.7 A26 26 0 0 1 195.3 83.1","#2F6FC0"],["M195.3 112.9 A26 26 0 0 1 183.3 122.3","#2F6FC0"],["M180.3 101.8 A26 26 0 0 1 182.5 86.8","#2E9A57"],["M208.2 72.1 A26 26 0 0 1 222.3 77.8","#2E9A57"]]
.map(([d,c])=>`<path d="${d}" fill="none" stroke="var(--kbg)" stroke-width="13"/><path d="${d}" fill="none" stroke="${c}" stroke-width="7"/>`).join('')+'</svg>';

const CLIENT_ID="631476153010-sm6d1udia8cn34mn3t7p4gnaaghcr9qh.apps.googleusercontent.com";
const SCOPE="https://www.googleapis.com/auth/drive";
const FOLDER_NAME="Bloco Mágico",DATA_NAME="bloco-magico-dados.json",KEY="bloco-magico-v1";
const DOCX="application/vnd.openxmlformats-officedocument.wordprocessingml.document",GDOC="application/vnd.google-apps.document";
const DOCQ=`(mimeType='${DOCX}' or mimeType='application/msword' or mimeType='${GDOC}')`;
const PALETTE=["#2A8C82","#7A4E8C","#4A6FA5","#B8862B","#A4563A","#5E7F3A","#9A4668","#3F7F99","#8C6A3F","#5B5FA8","#A13D3D","#3E8A63"];
const STATES={sem:"Sem fundamentação",parcial:"Parcialmente fundamentado",fund:"Fundamentado",concl:"Concluído"};
const TYPES={prim:"Fontes primárias",com:"Comentadores contemporâneos"};
const SEED=["Sujeito","Outro","Constituição do sujeito","Transferência","Repetição","Sujeito suposto saber","Posição do analista","Desejo do analista","Manejo","Demanda","Desejo","Sugestão","Pulsão","Afeto","Juízo","Disposição","Desamparo","Eu","Id","Supereu","Complexo de Édipo","Aparelho psíquico","Real","Simbólico","Imaginário","Fantasia","Saber","Interpretação","Interpretação da cena","Sintoma","Histeria","Psicose","Ética"];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowIso=()=>new Date().toISOString();
const isoDay=t=>t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
const todayIso=()=>isoDay(new Date());
const slug=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-");
const fold=t=>String(t).split("").map(c=>c.normalize("NFD")[0]||"").join("").toLowerCase();
const fmtTime=d=>new Date(d).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;

let token=null,tokenExp=0,tokenClient=null,tokenWait=null;
const hasToken=()=>!!token&&Date.now()<tokenExp-60000;
function gisReady(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();let n=0;const t=setInterval(()=>{if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(t);res()}else if(++n>80){clearInterval(t);rej(new Error("Não foi possível carregar o login do Google."))}},100)})}
async function getToken(interactive){
 if(hasToken())return token;
 if(!interactive)throw new Error("auth");
 await gisReady();
 if(!tokenClient)tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
  callback:r=>{const w=tokenWait;tokenWait=null;if(!w)return;if(r.error)w.rej(new Error("auth"));else{token=r.access_token;tokenExp=Date.now()+(+r.expires_in||3600)*1000;try{localStorage.setItem("bm-connected","1")}catch(e){}w.res(token)}},
  error_callback:e=>{const w=tokenWait;tokenWait=null;if(w)w.rej(new Error("auth"))}});
 let first=true;try{first=!localStorage.getItem("bm-connected")}catch(e){}
 return new Promise((res,rej)=>{tokenWait={res,rej};tokenClient.requestAccessToken({prompt:first?"consent":""})})}
async function api(path,opts={}){
 const t=await getToken(false);
 const r=await fetch("https://www.googleapis.com/"+path,{...opts,headers:{Authorization:"Bearer "+t,...(opts.headers||{})}});
 if(r.status===401){token=null;throw new Error("auth")}
 if(!r.ok){let m="";try{m=(await r.json()).error.message}catch(e){}const er=new Error(m||("Erro "+r.status));er.status=r.status;throw er}
 return r}
const qs=o=>new URLSearchParams(o).toString();
const qesc=s=>s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function listFiles(q,fields="files(id,name,modifiedTime,mimeType,webViewLink,parents)",extra={}){
 let out=[],pt="";do{const r=await(await api("drive/v3/files?"+qs({q,fields:"nextPageToken,"+fields,pageSize:"1000",...extra,...(pt?{pageToken:pt}:{})}))).json();out=out.concat(r.files||[]);pt=r.nextPageToken||""}while(pt&&out.length<5000);return out}
const fids={};
async function ensureFolder(name,parent){const f=await listFiles(`name='${qesc(name)}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`,"files(id)");if(f.length)return f[0].id;
 return(await(await api("drive/v3/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent]})})).json()).id}

 return(await api("upload/drive/v3/files"+(id?"/"+id:"")+"?uploadType=multipart&fields=id,name,webViewLink",{method:id?"PATCH":"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body})).json()}

const CT=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
const RELS=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
async function buildDocx(paras){
 if(!window.JSZip)throw new Error("Componente de Word ainda carregando. Tente de novo em instantes.");
 const clean=t=>String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
 const P=p=>{const[sz,b,i,before,after]={title:[36,1,0,0,120],h:[28,1,0,360,160],b:[24,1,0,120,40],p:[24,0,0,0,80],meta:[20,0,1,0,60]}[p.s]||[24,0,0,0,80];
  const txt=clean(p.t).split("\n").map(esc).join('</w:t></w:r><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="'+sz+'"/></w:rPr><w:br/><w:t xml:space="preserve">');
  return `<w:p><w:pPr><w:spacing w:before="${before}" w:after="${after}"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman"/>${b?"<w:b/>":""}${i?"<w:i/>":""}<w:sz w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${txt}</w:t></w:r></w:p>`};
 const z=new JSZip();z.file("[Content_Types].xml",CT);z.file("_rels/.rels",RELS);
 z.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${paras.map(P).join("")}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1701" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`);
 return z.generateAsync({type:"blob",mimeType:DOCX})}

/* ---------- sincronização ---------- */
let syncing=false,syncErr=false,syncTimer=null,lastSync=null,dirty=false;
try{dirty=localStorage.getItem("bm-dirty")==="1"}catch(e){}
function setDirty(v){dirty=v;try{localStorage.setItem("bm-dirty",v?"1":"0")}catch(e){}setSync()}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),2500)}
function syncText(){
 if(syncing)return "Sincronizando…";
 if(!navigator.onLine)return "Sem internet, salvo no aparelho";
 if(syncErr)return "Falha ao sincronizar. Toque para tentar";
 if(!hasToken())return lastSync?"Toque para sincronizar":"Toque para conectar ao Drive";
 if(dirty)return "Enviando alterações…";
 return lastSync?`Sincronizado às ${fmtTime(lastSync)}`:"Conectado ao Drive"}
function setSync(){document.querySelectorAll(".syncbtn").forEach(b=>b.textContent=syncText())}
async function sync(interactive){
 if(syncing)return;
 if(!navigator.onLine){setSync();if(interactive)toast("Sem internet. Tudo continua salvo no aparelho.");return}
 if(!interactive&&!hasToken()){setSync();return}
 syncing=true;syncErr=false;setSync();
 const before=JSON.stringify(db);
 try{
  await getToken(interactive);
  const folder=await appFolder();
  const found=await listFiles(`name='${DATA_NAME}' and '${folder}' in parents and trashed=false`,"files(id)");
  const fileId=found[0]&&found[0].id;let remote=null;
  if(fileId)remote=await(await api(`drive/v3/files/${fileId}?alt=media`)).json();
  const merged=remote?merge(db,remote):JSON.parse(JSON.stringify(db));
  const today=todayIso();
  if(remote&&(!merged.meta.lastBackup||(new Date(today)-new Date(merged.meta.lastBackup))/864e5>=7)){
   await upload({name:`backup-${today}.json`,parents:[folder]},new Blob([JSON.stringify(remote)],{type:"application/json"}));merged.meta.lastBackup=today}
  const blob=new Blob([JSON.stringify(merged)],{type:"application/json"});
  if(fileId)await upload({},blob,fileId);else await upload({name:DATA_NAME,parents:[folder]},blob);
  const editedMeanwhile=JSON.stringify(db)!==before;
  db=merge(db,merged);saveLocal();lastSync=new Date();
  if(editedMeanwhile){dirty=true;scheduleSync()}else setDirty(false);
  if(JSON.stringify(db)!==before)softRender();
 }catch(e){
  if(e.message!=="auth"){syncErr=true;if(interactive)toast("Não foi possível sincronizar. Tudo continua salvo no aparelho.")}
  else if(interactive)toast("Login não concluído. Toque de novo para conectar.");
 }finally{syncing=false;setSync();if(route.name==="batch"||link)softRender();if(route.name==="diss"&&hasToken()&&db.meta.dissFolder&&!dscan)scanDiss(false)}}

const DKINDS=[["red","Redação Consolidada"],["mapa","Mapa Demonstrativo"],["demo","Demonstração Documental"],["abnt","Versão ABNT"]];

function parseDissName(name){
 const t=fold(name).replace(/\.(docx?|pdf|odt)$/,"").replace(/_+/g," ");
 const kind=/redacao consolidada/.test(t)?"red":/mapa demonstrativo/.test(t)?"mapa":/demonstracao documental/.test(t)?"demo":/abnt/.test(t)?"abnt":/esquema de escrita/.test(t)?"esq":null;
 const m=t.match(/subtitulo\s*(\d{1,2})\s*[ .]\s*(\d{1,2})(?!\d)/)||t.match(/(?:^|[^\d.])(\d{1,2})[ .](\d{1,2})(?![\d.])/);
 return {kind,n:m?`${+m[1]}.${+m[2]}`:null}}
const countWords=t=>(String(t).match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu)||[]).length;
function dissFiles(){ // arquivos reconhecidos, agrupados por subtítulo e tipo (a versão mais recente de cada tipo)
 const by={},loose=[];
 (dscan&&dscan.files||[]).forEach(f=>{const p=parseDissName(f.name);if(!p.n||!p.kind){loose.push(f);return}
  const s=by[p.n]||(by[p.n]={}),cur=s[p.kind];
  if(!cur||(f.modifiedTime||"")>(cur.modifiedTime||""))s[p.kind]={...f,versions:(cur?cur.versions:0)+1};else cur.versions++});
 return {by,loose}}

  exportLinks[id]=r.webViewLink;render();return toast("Word salvo no Drive, em Bloco Mágico / Exportações.")}

   link=null;err="";changed();render();return toast("Renomeado e vinculado")}catch(e){link.busy=false;err="Não foi possível renomear no Drive. Verifique a internet e tente de novo.";return render()}}
 case "lcreate":{if(!link.title.trim()){err="Escreva um título curto.";return render()}await getToken(true);link.busy=true;render();const name=nameFor(link.cid,link.title,todayIso(),".docx");

   link=null;err="";changed();render();return toast("Documento criado no Drive e vinculado")}catch(e){link.busy=false;err="Não foi possível criar o documento. Verifique a internet e tente de novo.";return render()}}

   batch.done++;batch.idx++;batch.busy=false;err="";changed();primeBatch();render();window.scrollTo(0,0);return toast("Renomeado e vinculado")}
  catch(e){batch.busy=false;err="Não foi possível renomear no Drive. Verifique a internet e tente de novo.";return render()}}
